      function paintStockSwatches() {
        if (!stockSwatches) return;
        const id = stockPaletteId();
        const auto = !id;
        // Same palette grid already present: only sync flags (no DOM wipe / no jump).
        if (
          !auto &&
          stockSwatches.dataset.palette === id &&
          stockSwatches.childElementCount > 0
        ) {
          syncStockSwatchState();
          return;
        }
        const side = document.getElementById("bead-side");
        const scrollTop = side ? side.scrollTop : 0;
        stockSwatches.innerHTML = "";
        delete stockSwatches.dataset.palette;
        syncStockSwatchState();
        if (auto) {
          if (side) side.scrollTop = scrollTop;
          return;
        }
        const pal = FGPalettes.byId(id);
        const owned = FGBeadStock.ownedSet(id);
        const enabled = !!(stockEnabledEl && stockEnabledEl.checked);
        stockSwatches.classList.toggle("is-disabled", !enabled);
        stockSwatches.dataset.palette = id;
        pal.colors.forEach((c) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "stock-swatch" + (owned.has(c.id) ? " is-owned" : "");
          b.dataset.colorId = String(c.id);
          b.style.background = c.hex;
          b.title = FGPalettes.legendLabel(c);
          b.setAttribute("aria-pressed", owned.has(c.id) ? "true" : "false");
          b.disabled = !enabled;
          b.addEventListener("click", (e) => {
            e.preventDefault();
            toggleStockColor(id, c.id, b);
          });
          stockSwatches.appendChild(b);
        });
        if (side) side.scrollTop = scrollTop;
      }

      function toggleStockColor(paletteId, colorId, btn) {
        const next = FGBeadStock.getOwnedIds(paletteId);
        const i = next.indexOf(colorId);
        const nowOwned = i < 0;
        if (nowOwned) next.push(colorId);
        else next.splice(i, 1);
        FGBeadStock.setOwnedIds(paletteId, next);
        // Toggle in place — do not rebuild the grid (avoids scroll jump / focus loss).
        if (btn) {
          btn.classList.toggle("is-owned", nowOwned);
          btn.setAttribute("aria-pressed", nowOwned ? "true" : "false");
        }
        const side = document.getElementById("bead-side");
        const scrollTop = side ? side.scrollTop : 0;
        if (lastCounts) updateStockMissing(lastCounts, lastPalette);
        if (side) side.scrollTop = scrollTop;
        FGTool.track("perler", "stock_toggle");
      }

      function updateStockMissing(counts, palette) {
        if (!stockMissingEl) return;
        const side = document.getElementById("bead-side");
        const scrollTop = side ? side.scrollTop : 0;
        if (!isStockEnabled() || !counts || !palette) {
          stockMissingEl.hidden = true;
          stockMissingEl.setAttribute("hidden", "");
          stockMissingEl.innerHTML = "";
          if (side) side.scrollTop = scrollTop;
          return;
        }
        const missing = FGBeadStock.missingColors(counts, palette, currentOwnedSet());
        if (!missing.length) {
          stockMissingEl.hidden = false;
          stockMissingEl.removeAttribute("hidden");
          stockMissingEl.innerHTML =
            `<div class="panel__title">${t("perler.stock.missingTitle")}</div>` +
            `<p class="stock-missing__ok">${t("perler.stock.missingNone")}</p>`;
          if (side) side.scrollTop = scrollTop;
          return;
        }
        let missBeads = 0;
        missing.forEach((c) => {
          missBeads += counts[c.id] || 0;
        });
        stockMissingEl.hidden = false;
        stockMissingEl.removeAttribute("hidden");
        stockMissingEl.innerHTML =
          `<div class="panel__title">${t("perler.stock.missingTitle")}</div>` +
          `<p class="stock-missing__warn">${t("perler.stock.missingSummary")
            .replace("{n}", String(missing.length))
            .replace("{beads}", String(missBeads))}</p>` +
          `<ul class="stock-missing__list">` +
          missing
            .map(
              (c) =>
                `<li><span class="legend__chip" style="background:${c.hex}"></span>` +
                `<span>${FGPalettes.legendLabel(c)}</span><strong>${counts[c.id] || 0}</strong></li>`
            )
            .join("") +
          `</ul>`;
        if (side) side.scrollTop = scrollTop;
      }

      function resolvePalette(sampleData) {
        let palette;
        if (palEl.value === "auto") {
          palette = FGPalettes.fromExtracted(FGImage.extractPalette(sampleData, +nEl.value || 28));
        } else {
          palette = FGPalettes.byId(palEl.value);
        }
        if (isStockOnly() && palette && palette.id !== "auto") {
          const filtered = FGBeadStock.filterPaletteToStock(palette, currentOwnedSet());
          if (filtered) {
            FGTool.track("perler", "stock_only_match");
            return filtered;
          }
          // Need ≥2 owned colors; otherwise keep full palette (do not silently pretend stock-only worked).
          FGTool.track("perler", "stock_only_fallback");
          if (tip) tip.textContent = t("perler.stock.onlyFail");
        }
        return palette;
      }

      function buyHintKey(total, sideLen) {
        if (total >= 9000) return "perler.buy.huge";
        if (total >= 4500) return "perler.buy.large";
        if (sideLen >= 120) return "perler.buy.fine";
        return "perler.buy.ok";
      }

      function formatUsagePct(n, total) {
        const raw = total > 0 ? (n * 100) / total : 0;
        if (raw >= 10 || raw === 0) return Math.round(raw) + "%";
        return (Math.round(raw * 10) / 10).toFixed(1).replace(/\.0$/, "") + "%";
      }

      function updateBeadSummary(counts, palette, gw, gh, total) {
        const w = Math.max(1, gw | 0);
        const h = Math.max(1, gh | 0);
        beadSummary.hidden = false;
        beadTotal.innerHTML =
          `<strong>${total}</strong> ${t("perler.stat.beads")} · ` +
          `<strong>${Object.keys(counts).length}</strong> ${t("perler.stat.colors")} · ` +
          `<strong>${w}×${h}</strong>`;
        beadBuy.textContent = t(buyHintKey(total, Math.max(w, h)));
        const rows = palette.colors
          .map((c) => ({ c, n: counts[c.id] || 0 }))
          .filter((r) => r.n > 0)
          .sort((a, b) => b.n - a.n);
        lastUsageRows = {
          w,
          h,
          total,
          paletteName: FGPalettes.displayName(palette.name),
          rows,
        };
        if (btnCopyUsage) btnCopyUsage.disabled = !rows.length;
        const show = rows.slice(0, 14);
        beadList.innerHTML =
          show
            .map((r) => {
              const pct = formatUsagePct(r.n, total);
              return (
                `<li><span class="legend__chip" style="background:${r.c.hex}"></span>` +
                `<span>${FGPalettes.legendLabel(r.c)}</span>` +
                `<span class="bead-summary__pct">${pct}</span>` +
                `<strong>${r.n}</strong></li>`
              );
            })
            .join("") +
          (rows.length > show.length
            ? `<li class="bead-summary__more">${t("perler.buy.more").replace("{n}", String(rows.length - show.length))}</li>`
            : "");
      }

      async function copyUsageText() {
        if (!lastUsageRows || !lastUsageRows.rows.length) return;
        const u = lastUsageRows;
        const head =
          u.w +
          "×" +
          u.h +
          " · " +
          (u.paletteName || "") +
          " · " +
          u.rows.length +
          "色 · " +
          u.total +
          "颗";
        const lines = [head, ""].concat(
          u.rows.map((r) => {
            const code = (r.c.code || "").trim();
            const name = FGPalettes.colorName(r.c).trim();
            const label =
              name && code && name !== code
                ? name + "（" + code + "）"
                : name || code || String(r.c.id);
            const pct = formatUsagePct(r.n, u.total).replace(/%$/, "");
            return label + " · " + r.n + " 颗 · 占 " + pct + "%";
          })
        );
        const text = lines.join("\n");
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          if (tip) {
            tip.textContent = t("perler.copied");
          }
          FGTool.track("perler", "copy_usage");
        } catch (_) {
          if (tip) tip.textContent = t("perler.copyFail");
        }
      }

      function cloneImageData(img) {
        return new ImageData(new Uint8ClampedArray(img.data), img.width, img.height);
      }

      function clearUndo() {
        undoStack = [];
        if (btnEditUndo) btnEditUndo.disabled = true;
      }

      function pushUndo() {
        if (!lastQuantized) return;
        undoStack.push({
          img: cloneImageData(lastQuantized),
          mask: cloneEraseMask(),
        });
        while (undoStack.length > UNDO_MAX) undoStack.shift();
        if (btnEditUndo) btnEditUndo.disabled = false;
      }

      function setEditTool(tool, opts) {
        const o = opts || {};
        const next = tool || "paint";
        if (o.toggle && editArmed && next === editTool) {
          setEditArmed(false);
          editPainting = false;
          syncPreviewToggles();
          return;
        }
        editTool = next;
        if (panArmed) setPanArmed(false);
        editArmed = true;
        if (craftMode) setCraftMode(false);
        if (editPanel && editPanel.hidden) syncEditPanel(true);
        syncEditChrome();
        syncPreviewToggles();
      }

      /** Brush palette is always a fixed craft set — never the auto-extracted photo colors. */
      function getEditPalette() {
        const id = palEl.value;
        if (id && id !== "auto") {
          return FGPalettes.byId(id) || FGPalettes.byId("mard-221");
        }
        return FGPalettes.byId("mard-221");
      }

      function paintEditSwatches() {
        const editPal = getEditPalette();
        if (!editSwatches || !editPal) return;
        if (!brushColor || !editPal.colors.some((c) => c.id === brushColor.id)) {
          brushColor = editPal.colors[0] || null;
        }
        editSwatches.innerHTML = "";
        editPal.colors.forEach((c) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "edit-swatch" + (brushColor && brushColor.id === c.id ? " is-active" : "");
          b.style.background = c.hex;
          b.title = FGPalettes.legendLabel(c);
          b.setAttribute("aria-label", FGPalettes.legendLabel(c));
          b.addEventListener("click", () => {
            brushColor = c;
            if (isEraseTool(editTool) || !editArmed) setEditTool("paint");
            paintEditSwatches();
          });
          editSwatches.appendChild(b);
        });
      }

      function syncEditPanel(show) {
        if (!editPanel) return;
        editPanel.hidden = !show;
        if (show) {
          paintEditSwatches();
          /* Stay idle until user taps a tool — web + phone */
          if (!editArmed) syncEditChrome();
          else setEditTool(editTool);
          if (btnEditUndo) btnEditUndo.disabled = undoStack.length === 0;
        } else {
          editArmed = false;
          syncEditChrome();
        }
      }

      function syncCraftRangeLabel() {
        if (!craftRowLabel || !lastQuantized) return;
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        if (craftGuide === "row") {
          craftRow = Math.max(0, Math.min(h - 1, craftRow));
          craftRowLabel.textContent = t("perler.craft.rowOf")
            .replace("{n}", String(craftRow + 1))
            .replace("{total}", String(h));
        } else if (craftGuide === "column") {
          craftCol = Math.max(0, Math.min(w - 1, craftCol));
          craftRowLabel.textContent = t("perler.craft.colOf")
            .replace("{n}", String(craftCol + 1))
            .replace("{total}", String(w));
        } else if (craftGuide === "zone") {
          const layout = ensureCraftZoneLayout();
          const total = (layout && layout.zones && layout.zones.length) || 1;
          const z =
            layout &&
            FGBeadPlaceZones.getZone(
              layout,
              craftFocusZone.zr,
              craftFocusZone.zc
            );
          let idx = 1;
          if (layout && layout.zones) {
            const i = layout.zones.findIndex(
              (zz) =>
                zz.zr === craftFocusZone.zr && zz.zc === craftFocusZone.zc
            );
            if (i >= 0) idx = i + 1;
          }
          const rect =
            z
              ? t("perler.craft.zoneRect")
                  .replace("{x0}", String(z.x0 + 1))
                  .replace("{x1}", String(z.x1 + 1))
                  .replace("{y0}", String(z.y0 + 1))
                  .replace("{y1}", String(z.y1 + 1))
              : "";
          craftRowLabel.textContent =
            t("perler.craft.zoneOf")
              .replace("{n}", String(idx))
              .replace("{total}", String(total)) + (rect ? " · " + rect : "");
        }
      }

      function syncCraftChrome() {
        if (previewStage) previewStage.classList.toggle("is-craft", craftMode);
        if (craftDock) {
          craftDock.hidden = !craftMode;
          if (craftMode) craftDock.removeAttribute("hidden");
          else craftDock.setAttribute("hidden", "");
        }
        if (craftDockBar) {
          craftDockBar.title = craftMode ? t("perler.craft.hint") : "";
        }
        if (btnCraft) {
          btnCraft.classList.toggle("is-active", craftMode);
          btnCraft.textContent = t(craftMode ? "perler.craft.toggleOn" : "perler.craft.toggle");
        }
        if (craftRowCtrl) {
          const showRange =
            craftMode &&
            (craftGuide === "row" ||
              craftGuide === "column" ||
              craftGuide === "zone");
          craftRowCtrl.hidden = !showRange;
          if (showRange) craftRowCtrl.removeAttribute("hidden");
          else craftRowCtrl.setAttribute("hidden", "");
        }
        if (craftMirrorCtrl) {
          craftMirrorCtrl.hidden = !craftMode;
          if (craftMode) craftMirrorCtrl.removeAttribute("hidden");
          else craftMirrorCtrl.setAttribute("hidden", "");
        }
        if (btnCraftMirrorH) {
          btnCraftMirrorH.classList.toggle("is-active", craftMirrorH);
          btnCraftMirrorH.setAttribute(
            "aria-pressed",
            craftMirrorH ? "true" : "false"
          );
        }
        if (btnCraftMirrorV) {
          btnCraftMirrorV.classList.toggle("is-active", craftMirrorV);
          btnCraftMirrorV.setAttribute(
            "aria-pressed",
            craftMirrorV ? "true" : "false"
          );
        }
        document.querySelectorAll(".craft-mode").forEach((b) => {
          b.classList.toggle("is-active", b.getAttribute("data-craft-mode") === craftGuide);
        });
        if (btnCraftAxis) {
          btnCraftAxis.classList.toggle("is-active", craftAxisOn);
          btnCraftAxis.setAttribute("aria-pressed", craftAxisOn ? "true" : "false");
          btnCraftAxis.title = t("perler.craft.axisHint");
          btnCraftAxis.hidden = !craftMode;
        }
        syncCraftRangeLabel();
        applyViewTransform();
        syncPreviewToggles();
        syncCraftAxisUi();
        if (craftMode) rebuildCraftStepList();
        syncCraftStepUi();
      }

      function setCraftMode(on) {
        const want = !!on && !!lastQuantized;
        if (want && cutoutMode) exitCutoutMode(false);
        if (craftMode && !want) {
          /* Leaving follow mode: persist cell progress for this pattern */
          saveCraftProgressNow();
        }
        craftMode = want;
        if (!craftMode) {
          viewPanning = false;
          viewPanLast = null;
          craftPin = null;
          craftStepFromNav = false;
          craftStepIndex = -1;
          craftStepList = [];
          /* Leave follow: drop legend color highlight (progress still saved above) */
          craftFocusId = null;
          restoreHomeView();
        } else {
          syncCraftProgressToPattern();
          if (craftGuide === "color" && craftFocusId == null) {
            const first = lastPalette && lastPalette.colors.find((c) => (lastCounts[c.id] || 0) > 0);
            craftFocusId = first ? first.id : null;
          }
          if (
            craftGuide === "row" ||
            craftGuide === "column" ||
            craftGuide === "zone"
          ) {
            craftFocusId = null;
          }
          craftRow = Math.max(0, Math.min(craftRow, (lastQuantized.height || 1) - 1));
          craftCol = Math.max(0, Math.min(craftCol, (lastQuantized.width || 1) - 1));
          ensureCraftZoneLayout();
          craftPin = null;
          craftStepFromNav = false;
          rebuildCraftStepList({ reset: true });
          FGTool.track("perler", "craft_on");
        }
        syncCraftChrome();
        syncEditPanel(!craftMode && !!lastQuantized);
        syncEraseUi();
        syncCutoutUi();
        if (lastQuantized) drawPatternCanvas();
        paintLegend(lastCounts || {});
        syncCraftAxisUi();
        syncCraftStepUi();
      }

      /** Switch craft guide mode and drop overlays that don't apply. */
      function setCraftGuide(mode) {
        const allowed = { color: 1, row: 1, column: 1, zone: 1 };
        const next = allowed[mode] ? mode : "color";
        if (next === craftGuide) {
          syncCraftChrome();
          syncCraftStepUi();
          return;
        }
        craftGuide = next;
        craftPin = null;
        craftStepFromNav = false;
        if (craftGuide === "row") {
          craftFocusId = null;
          craftRow = 0;
        } else if (craftGuide === "column") {
          craftFocusId = null;
          craftCol = 0;
        } else if (craftGuide === "zone") {
          craftFocusId = null;
          craftFocusZone = { zr: 0, zc: 0 };
          craftZoneLayout = null;
          ensureCraftZoneLayout();
          if (!buildCraftStepList().length) promoteCraftRangeIfEmpty();
        } else {
          craftRow = 0;
          craftCol = 0;
          if (craftFocusId == null) {
            const first =
              lastPalette &&
              lastPalette.colors.find((c) => (lastCounts[c.id] || 0) > 0);
            craftFocusId = first ? first.id : null;
          }
        }
        rebuildCraftStepList({ reset: true });
        syncCraftChrome();
        paintLegend(lastCounts || {});
        if (lastQuantized) drawPatternCanvas();
        syncCraftAxisUi();
        syncCraftStepUi();
      }

      function buildCraftImageData() {
        const src = lastQuantized;
        const out = cloneImageData(src);
        const d = out.data;
        const w = src.width;
        const h = src.height;
        const rgbToId = Object.create(null);
        lastPalette.colors.forEach((c) => {
          const rgb = c.rgb || FGPalettes.hexToRgb(c.hex);
          rgbToId[rgb[0] + "," + rgb[1] + "," + rgb[2]] = c.id;
        });
        const rowMode = craftMode && craftGuide === "row";
        const colMode = craftMode && craftGuide === "column";
        const zoneMode = craftMode && craftGuide === "zone";
        const rangeMode = rowMode || colMode || zoneMode;
        /* Color focus: legend / by-color; range modes show every hue in range. */
        const focusId = rangeMode ? null : craftFocusId;
        let zx0 = 0;
        let zx1 = w - 1;
        let zy0 = 0;
        let zy1 = h - 1;
        if (zoneMode) {
          const layout = ensureCraftZoneLayout();
          const z =
            layout &&
            FGBeadPlaceZones.getZone(
              layout,
              craftFocusZone.zr,
              craftFocusZone.zc
            );
          if (z) {
            zx0 = z.x0;
            zx1 = z.x1;
            zy0 = z.y0;
            zy1 = z.y1;
          }
        }
        /* Dim non-focus in place (keep silhouette) — do not erase the board. */
        const fogR = 48;
        const fogG = 50;
        const fogB = 58;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (d[i + 3] < 16) continue;
            const id = rgbToId[d[i] + "," + d[i + 1] + "," + d[i + 2]];
            const vx = mirrorH ? w - 1 - x : x;
            const placed = isCellPlaced(vx, y);
            const offRange =
              (rowMode && y !== craftRow) ||
              (colMode && vx !== craftCol) ||
              (zoneMode &&
                (vx < zx0 || vx > zx1 || y < zy0 || y > zy1));
            const notFocus =
              focusId != null && (id == null || !colorIdEq(id, focusId));
            if (!offRange && !notFocus && !placed) {
              /* Focus (or all colors when no focus): keep true hue. */
              continue;
            }
            if (notFocus || offRange) {
              /* Keep hue, dim strongly so the full grid stays in place and readable. */
              const keep = offRange ? 0.12 : 0.28;
              const aMul = offRange ? 0.35 : 0.5;
              d[i] = Math.round(d[i] * keep + fogR * (1 - keep));
              d[i + 1] = Math.round(d[i + 1] * keep + fogG * (1 - keep));
              d[i + 2] = Math.round(d[i + 2] * keep + fogB * (1 - keep));
              d[i + 3] = Math.round(d[i + 3] * aMul);
              continue;
            }
            /* Placed cell: muted original (overlay draws hatch on top). */
            const keep = 0.35;
            d[i] = Math.round(d[i] * keep + fogR * (1 - keep));
            d[i + 1] = Math.round(d[i + 1] * keep + fogG * (1 - keep));
            d[i + 2] = Math.round(d[i + 2] * keep + fogB * (1 - keep));
            d[i + 3] = Math.round(d[i + 3] * 0.55);
          }
        }
        return out;
      }

      /** Hatch / dim mask on placed beads (visual coords; canvas is already mirrored). */
      function drawPlacedOverlay(cell, beads) {
        if (!craftPlaced.size || !lastQuantized || !canvas) return;
        const gap = beads ? 1 : 0;
        const step = cell + gap;
        const ctx = canvas.getContext("2d");
        const hatch = Math.max(2, Math.round(cell * 0.22));
        ctx.save();
        craftPlaced.forEach((key) => {
          const parts = String(key).split(",");
          const vx = +parts[0];
          const y = +parts[1];
          if (!Number.isFinite(vx) || !Number.isFinite(y)) return;
          const x0 = vx * step;
          const y0 = y * step;
          if (beads) {
            const cx = x0 + cell / 2;
            const cy = y0 + cell / 2;
            const r = cell * 0.46;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(10, 8, 18, 0.5)";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 229, 102, 0.55)";
            ctx.lineWidth = Math.max(1, cell * 0.06);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - r * 0.35, cy);
            ctx.lineTo(cx - r * 0.08, cy + r * 0.32);
            ctx.lineTo(cx + r * 0.42, cy - r * 0.28);
            ctx.strokeStyle = "rgba(255, 236, 160, 0.9)";
            ctx.lineWidth = Math.max(1.2, cell * 0.1);
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.stroke();
          } else {
            ctx.fillStyle = "rgba(10, 8, 18, 0.42)";
            ctx.fillRect(x0, y0, cell, cell);
            ctx.strokeStyle = "rgba(255, 229, 102, 0.4)";
            ctx.lineWidth = 1;
            for (let s = -cell; s < cell * 2; s += hatch) {
              ctx.beginPath();
              ctx.moveTo(x0 + s, y0);
              ctx.lineTo(x0 + s + cell, y0 + cell);
              ctx.stroke();
            }
          }
        });
        ctx.restore();
      }

      /** High-contrast ring on focus beads (light → dark edge, dark → bright edge). */
      function drawCraftFocusMarks(cell, beads) {
        if (!hasColorFocus() || !lastPalette || !lastQuantized) return;
        const focus = lastPalette.colors.find((c) => c.id === craftFocusId);
        if (!focus) return;
        const rgb = focus.rgb || FGPalettes.hexToRgb(focus.hex);
        if (!rgb) return;
        const fr = rgb[0];
        const fg = rgb[1];
        const fb = rgb[2];
        const lum = 0.2126 * fr + 0.7152 * fg + 0.0722 * fb;
        const edge = lum >= 150 ? "rgba(20,14,8,0.92)" : "rgba(255,236,160,0.95)";
        const halo = lum >= 150 ? "rgba(255,255,255,0.75)" : "rgba(20,14,8,0.55)";
        const src = lastQuantized;
        const d = src.data;
        const w = src.width;
        const h = src.height;
        const gap = beads ? 1 : 0;
        const step = cell + gap;
        const ctx = canvas.getContext("2d");
        const lw = Math.max(1.5, Math.min(3.5, cell * 0.12));
        ctx.save();
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (d[i + 3] < 16) continue;
            if (d[i] !== fr || d[i + 1] !== fg || d[i + 2] !== fb) continue;
            const cx = x * step + cell / 2;
            const cy = y * step + cell / 2;
            if (beads) {
              const r = cell * 0.46;
              ctx.beginPath();
              ctx.arc(cx, cy, r + lw * 0.35, 0, Math.PI * 2);
              ctx.strokeStyle = halo;
              ctx.lineWidth = lw + 1.2;
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(cx, cy, r, 0, Math.PI * 2);
              ctx.strokeStyle = edge;
              ctx.lineWidth = lw;
              ctx.stroke();
            } else {
              const x0 = x * step + 0.5;
              const y0 = y * step + 0.5;
              const s = cell - 1;
              ctx.strokeStyle = halo;
              ctx.lineWidth = lw + 1;
              ctx.strokeRect(x0 - 0.5, y0 - 0.5, s + 1, s + 1);
              ctx.strokeStyle = edge;
              ctx.lineWidth = lw;
              ctx.strokeRect(x0, y0, s, s);
            }
          }
        }
        ctx.restore();
      }

      function drawPatternCanvas() {
        if (!lastQuantized || !lastPalette) return;
        const side = lastQuantized.width;
        const m = boardMetrics();
        let cell = m.baseCell;
        const beads = m.beads;
        const data = displayPatternData();
        if (!data) return;
        if (showCellCodes) {
          // Rasterize at zoom × device pixels so codes sit on bead centers and stay sharp.
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          cell = Math.max(8, Math.round(m.baseCell * viewScale * dpr));
          const maxEdge = 4096;
          if (m.cols * cell > maxEdge) cell = Math.max(8, Math.floor(maxEdge / m.cols));
          if (m.rows * cell > maxEdge) cell = Math.max(8, Math.floor(maxEdge / m.rows));
        }
        if (beads) FGImage.drawBeadGrid(canvas, data, cell, 1);
        else {
          FGImage.drawImageData(canvas, data, cell);
          if (gridEl.checked) {
            FGImage.drawGridOverlay(canvas, lastQuantized.width, lastQuantized.height, cell);
          }
        }
        if (showCellCodes && FGImage.drawCellCodeOverlay) {
          FGImage.drawCellCodeOverlay(canvas, data, cell, {
            beads: beads,
            gap: beads ? 1 : 0,
            paletteColors: lastPalette.colors,
            labelFn: cellCodeLabel,
            sharp: true,
          });
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          canvas.style.width = canvas.width / dpr + "px";
          canvas.style.height = canvas.height / dpr + "px";
        } else {
          canvas.style.width = "";
          canvas.style.height = "";
        }
        if (hasColorFocus()) {
          drawCraftFocusMarks(cell, beads);
        }
        drawPlacedOverlay(cell, beads);
        // Range guide outline (row / column / zone)
        if (
          craftMode &&
          (craftGuide === "row" ||
            craftGuide === "column" ||
            craftGuide === "zone")
        ) {
          const ctx = canvas.getContext("2d");
          const step = beads ? cell + 1 : cell;
          const w = lastQuantized.width;
          const h = lastQuantized.height;
          let rx0 = 0;
          let ry0 = 0;
          let rw = w;
          let rh = h;
          if (craftGuide === "row") {
            ry0 = craftRow;
            rh = 1;
          } else if (craftGuide === "column") {
            rx0 = craftCol;
            rw = 1;
          } else {
            const layout = ensureCraftZoneLayout();
            const z =
              layout &&
              FGBeadPlaceZones.getZone(
                layout,
                craftFocusZone.zr,
                craftFocusZone.zc
              );
            if (z) {
              rx0 = z.x0;
              ry0 = z.y0;
              rw = z.x1 - z.x0 + 1;
              rh = z.y1 - z.y0 + 1;
            }
          }
          ctx.save();
          ctx.strokeStyle = "rgba(232,160,84,0.95)";
          ctx.lineWidth = Math.max(2, Math.round(cell * 0.06));
          ctx.strokeRect(
            rx0 * step + 0.5,
            ry0 * step + 0.5,
            rw * step - 1,
            rh * step - 1
          );
          ctx.restore();
        }
        syncCraftAxisUi();
      }

      function paintLegend(counts) {
        if (!legend || !lastPalette) return;
        const owned = isStockEnabled() ? currentOwnedSet() : null;
        const colorFocusOn = hasColorFocus();
        legend.innerHTML = lastPalette.colors
          .map((c) => {
            const n = counts[c.id] || 0;
            if (!n) return "";
            const label = FGPalettes.legendLabel(c);
            const miss = owned && !owned.has(c.id);
            const focus = colorFocusOn && colorIdEq(craftFocusId, c.id);
            const done =
              (craftMode || craftPlaced.size > 0) && craftDoneIds.has(c.id);
            const cls =
              "legend__row legend__row--pick" +
              (miss ? " legend__row--missing" : "") +
              (craftMode ? " legend__row--craft" : "") +
              (focus ? " is-focus" : "") +
              (done ? " is-done" : "");
            const rgb = c.rgb || (FGPalettes.hexToRgb && FGPalettes.hexToRgb(c.hex));
            const lum = rgb
              ? 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]
              : 128;
            const chipExtra =
              lum >= 200
                ? " legend__chip--light"
                : lum <= 55
                  ? " legend__chip--dark"
                  : "";
            const doneCtrl = craftMode
              ? `<label class="legend__done" data-craft-done="${c.id}">` +
                `<input type="checkbox" ${craftDoneIds.has(c.id) ? "checked" : ""} />` +
                `<span>${t("perler.craft.done")}</span></label>`
              : "";
            const focusHint = String(t("perler.legend.focusHint") || "")
              .replace(/&/g, "&amp;")
              .replace(/"/g, "&quot;");
            return (
              `<div class="${cls}" data-craft-focus="${c.id}" title="${focusHint}">` +
              `<span class="legend__chip${chipExtra}" style="background:${c.hex}"></span>` +
              `<span class="legend__label">${label}${miss ? " · " + t("perler.stock.tagMissing") : ""}</span>` +
              doneCtrl +
              `<strong style="margin-left:auto">${n}</strong></div>`
            );
          })
          .join("");

        legend.querySelectorAll("[data-craft-focus]").forEach((row) => {
          row.addEventListener("click", (e) => {
            if (e.target && e.target.closest("[data-craft-done]")) return;
            const raw = row.getAttribute("data-craft-focus");
            const matched =
              lastPalette &&
              lastPalette.colors.find((c) => colorIdEq(c.id, raw));
            const id = matched ? matched.id : +raw;
            if (
              craftMode &&
              (craftGuide === "row" ||
                craftGuide === "column" ||
                craftGuide === "zone")
            ) {
              craftGuide = "color";
              craftRow = 0;
              craftCol = 0;
              syncCraftChrome();
            }
            craftFocusId = colorIdEq(craftFocusId, id) ? null : id;
            /* Color pick: only recolor — freeze camera (no pan / no re-fit) */
            craftPin = null;
            craftStepFromNav = false;
            if (craftMode) rebuildCraftStepList({ reset: true });
            const keepScale = viewScale;
            const keepPanX = viewPanX;
            const keepPanY = viewPanY;
            paintLegend(lastCounts || {});
            drawPatternCanvas();
            viewScale = keepScale;
            viewPanX = keepPanX;
            viewPanY = keepPanY;
            applyViewTransform();
            syncCraftStepUi();
            FGTool.track("perler", craftMode ? "craft_focus" : "legend_focus");
          });
        });
        if (!craftMode) return;
        legend.querySelectorAll("[data-craft-done] input").forEach((inp) => {
          inp.addEventListener("click", (e) => e.stopPropagation());
          inp.addEventListener("change", () => {
            const raw = inp.closest("[data-craft-done]").getAttribute("data-craft-done");
            const matched =
              lastPalette &&
              lastPalette.colors.find((c) => colorIdEq(c.id, raw));
            const id = matched ? matched.id : +raw;
            setColorCellsPlaced(id, !!inp.checked);
            syncCraftDoneIdsFromPlaced();
            saveCraftProgressNow();
            rebuildCraftStepList({ reset: true });
            paintLegend(lastCounts || {});
            drawPatternCanvas();
            syncCraftStepUi();
            FGTool.track("perler", inp.checked ? "craft_done" : "craft_undone");
          });
        });
      }

      function refreshFromQuantized() {
        if (!lastQuantized || !lastPalette) return;
        const gw = lastQuantized.width;
        const gh = lastQuantized.height;
        lastSide = Math.max(gw, gh);
        lastGridCanvas = document.createElement("canvas");
        lastGridCanvas.width = gw;
        lastGridCanvas.height = gh;
        lastGridCanvas.getContext("2d").putImageData(lastQuantized, 0, 0);

        const counts = FGImage.countColors(lastQuantized, lastPalette.colors);
        lastCounts = counts;
        syncCraftProgressToPattern();

        drawPatternCanvas();
        const fitKey = gw + "x" + gh;
        if (!lastViewFitKey || fitKey !== lastViewFitKey) fitView();
        const levelSide = Math.max(gw, gh);
        const levelResult = FGBeadLevel.imageToLevel(lastGridCanvas, {
          side: levelSide,
          chunk: 32,
          name: (nameEl && nameEl.value.trim()) || "Custom",
          id: 99,
        });
        lastLevel = levelResult.level;
        let total = 0;
        Object.values(counts).forEach((n) => (total += n));
        // Craft stats only — game remap / deck counts live in #cta-play.
        stats.innerHTML =
          `<span><strong>${gw}×${gh}</strong> ${t("perler.stat.grid")}</span>` +
          `<span>${t("perler.stat.beads")} <strong>${total}</strong></span>` +
          `<span>${t("perler.stat.colors")} <strong>${Object.keys(counts).length}</strong> / ${lastPalette.colors.length}</span>` +
          `<span>${FGPalettes.displayName(lastPalette.name)}</span>`;

        updateBeadSummary(counts, lastPalette, gw, gh, total);
        updateStockMissing(counts, lastPalette);
        updateStructureUi();
        paintLegend(counts);
        if (btnCraft) btnCraft.disabled = false;
        syncCraftChrome();
        syncDraftChrome();
        setExportEnabled(true);
        syncCta();
        syncEditPanel(!craftMode);
      }

      function applyQuantizedHandoff(imageData, paletteOrId) {
        const pal =
          paletteOrId && paletteOrId.colors
            ? paletteOrId
            : (paletteOrId &&
                paletteOrId !== "auto" &&
                FGPalettes.PRESETS.some((p) => p.id === paletteOrId) &&
                FGPalettes.byId(paletteOrId)) ||
              FGPalettes.byId("mard-221");
        applyingPreset = true;
        presetEl.value = "custom";
        if (FGPalettes.PRESETS.some((p) => p.id === pal.id)) palEl.value = pal.id;
        applyingPreset = false;
        syncNField();
        lastPalette = pal;
        lastQuantizedBase = cloneImageData(imageData);
        lastSide = imageData.width;
        clearEraseMask();
        clearUndo();
        const c = document.createElement("canvas");
        c.width = imageData.width;
        c.height = imageData.height;
        c.getContext("2d").putImageData(imageData, 0, 0);
        sourceImg = c;
        fromTemplate = false;
        showPaletteBanner(pal.id, pal.name);
        applyRmBgFromBase();
      }

      function pixelIndex(x, y) {
        return (y * lastQuantized.width + x) * 4;
      }

      function readPixel(x, y) {
        const i = pixelIndex(x, y);
        const d = lastQuantized.data;
        return { r: d[i], g: d[i + 1], b: d[i + 2], a: d[i + 3] };
      }

      function writePixel(x, y, r, g, b, a) {
        const i = pixelIndex(x, y);
        const d = lastQuantized.data;
        d[i] = r;
        d[i + 1] = g;
        d[i + 2] = b;
        d[i + 3] = a;
      }

      function samePixel(p, r, g, b, a) {
        if (p.a < 16 && a < 16) return true;
        if (p.a < 16 || a < 16) return false;
        return p.r === r && p.g === g && p.b === b;
      }

      function brushRgba() {
        if (isEraseTool(editTool) || !brushColor) return { r: 0, g: 0, b: 0, a: 0 };
        const rgb = brushColor.rgb || FGPalettes.hexToRgb(brushColor.hex);
        return { r: rgb[0], g: rgb[1], b: rgb[2], a: 255 };
      }

      function writePixelTracked(x, y, r, g, b, a) {
        writePixel(x, y, r, g, b, a);
        if (a < 16) markEraseCell(x, y, true);
        else markEraseCell(x, y, false);
      }

      function stampBrushAt(cx, cy, r, g, b, a) {
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        const R = editTool === "eraser" ? eraseBrushRadius() : 0;
        let changed = false;
        for (let dy = -R; dy <= R; dy++) {
          for (let dx = -R; dx <= R; dx++) {
            if (R > 0 && dx * dx + dy * dy > R * R + 0.25) continue;
            const x = cx + dx;
            const y = cy + dy;
            if (x < 0 || y < 0 || x >= w || y >= h) continue;
            const cur = readPixel(x, y);
            if (samePixel(cur, r, g, b, a)) continue;
            writePixelTracked(x, y, r, g, b, a);
            changed = true;
          }
        }
        return changed;
      }

      function floodFill(sx, sy, tr, tg, tb, ta) {
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        const start = readPixel(sx, sy);
        if (samePixel(start, tr, tg, tb, ta)) return false;
        const stack = [[sx, sy]];
        const seen = new Uint8Array(w * h);
        let changed = false;
        while (stack.length) {
          const [x, y] = stack.pop();
          if (x < 0 || y < 0 || x >= w || y >= h) continue;
          const key = y * w + x;
          if (seen[key]) continue;
          seen[key] = 1;
          const p = readPixel(x, y);
          if (!samePixel(p, start.r, start.g, start.b, start.a)) continue;
          writePixelTracked(x, y, tr, tg, tb, ta);
          changed = true;
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        return changed;
      }

      function replaceColorAt(sx, sy, tr, tg, tb, ta) {
        const start = readPixel(sx, sy);
        if (samePixel(start, tr, tg, tb, ta)) return false;
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        let changed = false;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const p = readPixel(x, y);
            if (!samePixel(p, start.r, start.g, start.b, start.a)) continue;
            writePixelTracked(x, y, tr, tg, tb, ta);
            changed = true;
          }
        }
        return changed;
      }

      function cellFromEvent(e) {
        if (!lastQuantized) return null;
        const pt = e.touches && e.touches[0] ? e.touches[0] : e;
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        let x = Math.floor(((pt.clientX - rect.left) / rect.width) * lastQuantized.width);
        const y = Math.floor(((pt.clientY - rect.top) / rect.height) * lastQuantized.height);
        if (x < 0 || y < 0 || x >= lastQuantized.width || y >= lastQuantized.height) return null;
        // Display is mirrored; map click back to source grid for edit / craft
        if (mirrorH) x = lastQuantized.width - 1 - x;
        return { x, y };
      }

      function applyEditAt(x, y, opts) {
        opts = opts || {};
        const stroke = !!opts.stroke;
        if (!lastQuantized) return;
        if (!isEraseTool(editTool) && !brushColor) return;
        const { r, g, b, a } = brushRgba();

        if (editTool === "paint" || editTool === "eraser") {
          if (!stroke || !editStrokeDirty) {
            pushUndo();
            editStrokeDirty = true;
          }
          if (!stampBrushAt(x, y, r, g, b, a)) {
            if (!stroke) {
              undoStack.pop();
              if (btnEditUndo) btnEditUndo.disabled = undoStack.length === 0;
              editStrokeDirty = false;
            }
            return;
          }
          refreshFromQuantized();
          return;
        }

        if (editTool === "bucket" || editTool === "erase-fill") {
          if (stroke) return;
          pushUndo();
          if (!floodFill(x, y, r, g, b, a)) {
            undoStack.pop();
            if (btnEditUndo) btnEditUndo.disabled = undoStack.length === 0;
            return;
          }
          FGTool.track("perler", editTool === "erase-fill" ? "erase_fill" : "edit_bucket");
          refreshFromQuantized();
          return;
        }

        if (editTool === "replace") {
          if (stroke) return;
          pushUndo();
          if (!replaceColorAt(x, y, r, g, b, a)) {
            undoStack.pop();
            if (btnEditUndo) btnEditUndo.disabled = undoStack.length === 0;
            return;
          }
          FGTool.track("perler", "edit_replace");
          refreshFromQuantized();
        }
      }

      function undoEdit() {
        if (!undoStack.length || !lastQuantized) return;
        const snap = undoStack.pop();
        if (snap && snap.img) {
          lastQuantized = snap.img;
          eraseMask = snap.mask ? new Uint8Array(snap.mask) : null;
        } else {
          /* legacy flat ImageData entries */
          lastQuantized = snap;
        }
        if (btnEditUndo) btnEditUndo.disabled = undoStack.length === 0;
        FGTool.track("perler", "edit_undo");
        refreshFromQuantized();
      }

      /** Same as weapp「散色合并」: remap rare RGB colors onto nearer keepers. */
      function mergeSparseEdit() {
        if (!lastQuantized || !FGImage.mergeSparseColors) return;
        let thr = sparseThrEl ? +sparseThrEl.value : 5;
        if (!Number.isFinite(thr)) thr = 5;
        thr = Math.max(1, Math.min(20, Math.round(thr)));
        if (sparseThrEl) sparseThrEl.value = String(thr);
        pushUndo();
        const result = FGImage.mergeSparseColors(lastQuantized, thr);
        if (!result.cells) {
          undoStack.pop();
          if (btnEditUndo) btnEditUndo.disabled = undoStack.length === 0;
          if (tip) {
            tip.removeAttribute("data-i18n");
            tip.textContent = t("perler.sparse.none").replace("{t}", String(thr));
          }
          return;
        }
        lastQuantized = result.imageData;
        if (lastQuantizedBase) {
          const baseMerged = FGImage.mergeSparseColors(lastQuantizedBase, thr);
          if (baseMerged.cells) lastQuantizedBase = baseMerged.imageData;
        }
        FGTool.track("perler", "sparse_merge", { thr: thr, n: result.mergedColors, c: result.cells });
        if (tip) {
          tip.removeAttribute("data-i18n");
          tip.textContent = t("perler.sparse.done")
            .replace("{n}", String(result.mergedColors))
            .replace("{c}", String(result.cells));
        }
        refreshFromQuantized();
      }

      function fitOpts(extra) {
        const o = Object.assign({}, extra || {});
        if (sourceCropRect && sourceCropRect.w > 0 && sourceCropRect.h > 0) {
          o.sourceRect = sourceCropRect;
        }
        return o;
      }

      /** Grid cols×rows from side slider; follows crop aspect when框选 is on. */
      function boardGridForSide(side) {
        const n = Math.max(32, Math.min(144, side | 0 || 96));
        if (
          sourceCropRect &&
          sourceCropRect.w > 0 &&
          sourceCropRect.h > 0 &&
          FGImage.boardDimsFromAspect
        ) {
          return FGImage.boardDimsFromAspect(
            n,
            sourceCropRect.w,
            sourceCropRect.h
          );
        }
        return { cols: n, rows: n };
      }

      function render() {
        if (!sourceImg) return;
        if (cutoutMode) exitCutoutMode(false);
        const side = Math.max(32, Math.min(144, +sideEl.value || 96));
        sideEl.value = String(side);
        const grid = boardGridForSide(side);
        const cols = grid.cols;
        const rows = grid.rows;
        sideHint.textContent =
          cols === rows ? String(side) : cols + "×" + rows;
        lastSide = Math.max(cols, rows);
        const contrast = (+contrastEl.value || 100) / 100;
        const sat = (+satEl.value || 100) / 100;
        contrastVal.textContent = contrast.toFixed(2);
        satVal.textContent = sat.toFixed(2);

        const dither = ditherEl.value;
        function fitBoard(c, r, fitMode, o) {
          if (FGImage.fitImageToGrid) {
            return FGImage.fitImageToGrid(sourceImg, c, r, fitMode, o);
          }
          return FGImage.fitImageToSquare(sourceImg, Math.max(c, r), fitMode, o);
        }
        /*
         * Cartoon / flat art: detect on nearest-neighbor probe BEFORE smooth resize.
         * Smooth shrink invents AA mud → nearest bead jumps (even with dither off).
         */
        let isFlatArt = false;
        if (!fromTemplate && FGBeadFsV2 && FGBeadFsV2.detectFlatArt) {
          try {
            const probeGrid = boardGridForSide(96);
            const probe = fitBoard(
              probeGrid.cols,
              probeGrid.rows,
              fitEl.value,
              fitOpts({ smooth: false })
            );
            isFlatArt = FGBeadFsV2.detectFlatArt(
              probe.data.data,
              probe.data.width,
              probe.data.height,
              16
            );
          } catch (_) {
            isFlatArt = false;
          }
        }
        let { data } = fitBoard(
          cols,
          rows,
          fitEl.value,
          fitOpts({ smooth: !fromTemplate && !isFlatArt })
        );
        if (!fromTemplate && !isFlatArt && (contrast !== 1 || sat !== 1)) {
          data = FGImage.adjustImageData(data, { contrast, saturation: sat });
        }
        if (cleanSkipWhiteEl && cleanSkipWhiteEl.checked && FGImage.clearNearWhite) {
          data = FGImage.clearNearWhite(data).data;
        }
        const palette = resolvePalette(data);
        /* Handlike / FS V2 are separate modules — never routed through FGImage.quantizeImageData. */
        let quantized;
        const budget = Math.max(0, Math.min(64, +nEl.value || 0));
        const useCartoonV2 =
          FGBeadFsV2 && dither !== "handlike" && (dither === "fs-v2" || isFlatArt);
        if (useCartoonV2) {
          const opts = { contentMode: "flat", snapEdges: true };
          if (palEl.value === "auto" || budget > 0) {
            opts.maxColors = Math.min(budget || 16, palette.colors.length);
          }
          quantized = FGBeadFsV2.quantizeImageData(data, palette.colors, opts);
          FGTool.track("perler", dither === "fs-v2" ? "cartoon_v2" : "flat_art_pipeline");
          if (tip) {
            tip.setAttribute("data-i18n", "perler.tip.flatArt");
            tip.textContent = t("perler.tip.flatArt");
          }
        } else if (dither === "handlike" && FGBeadHandlike) {
          quantized = FGBeadHandlike.quantizeImageData(data, palette.colors, {
            maxColors: Math.min(Math.max(2, budget || 24), palette.colors.length),
          });
        } else {
          quantized = FGImage.quantizeImageData(data, palette.colors, {
            dither: dither === "none" ? "none" : dither,
            ditherStrength: dither === "fs" ? 0.85 : 1,
          });
        }
        if (cleanSmoothEl && cleanSmoothEl.checked && FGImage.smoothMajorityImageData) {
          quantized = FGImage.smoothMajorityImageData(quantized);
        }
        if (!isFlatArt && dither !== "fs-v2" && tip) {
          tip.setAttribute("data-i18n", tipKey);
          tip.textContent = t(tipKey);
        }
        lastQuantizedBase = quantized;
        lastPalette = palette;
        craftRow = 0;
        clearEraseMask();
        const editPal = getEditPalette();
        brushColor = (editPal && editPal.colors[0]) || null;
        applyRmBgFromBase();
        syncCropUi();
      }

      /** Pattern data for file export (ignore craft dimming). */
      function exportPatternData() {
        if (!lastQuantized) return null;
        if (mirrorH && FGImage.mirrorImageDataH) {
          return FGImage.mirrorImageDataH(lastQuantized);
        }
        return lastQuantized;
      }

      function codesExportCellFor(cols, rows) {
        let cell = CODES_EXPORT_CELL;
        if (cols * cell > CODES_EXPORT_MAX_EDGE) {
          cell = Math.max(16, Math.floor(CODES_EXPORT_MAX_EDGE / cols));
        }
        if (rows * cell > CODES_EXPORT_MAX_EDGE) {
          cell = Math.max(16, Math.floor(CODES_EXPORT_MAX_EDGE / rows));
        }
        return cell;
      }

      /** Parse 0–100; treat empty/NaN as 50, keep real 0. */
      function clampGridInk(ink) {
        const n = ink == null || ink === "" ? NaN : +ink;
        if (!Number.isFinite(n)) return 50;
        return Math.max(0, Math.min(100, n));
      }

      /** gridInk 0–100 → stroke alpha (50 ≈ prior default ~0.18). */
      function exportGridColors(ink) {
        const t = clampGridInk(ink) / 100;
        const minorA =
          t <= 0.5 ? 0.04 + t * 0.28 : 0.18 + (t - 0.5) * 0.82;
        const majorA =
          t <= 0.5 ? 0.16 + t * 0.78 : 0.55 + (t - 0.5) * 0.8;
        return {
          minorColor: "rgba(0,0,0," + minorA.toFixed(3) + ")",
          majorColor: "rgba(0,0,0," + majorA.toFixed(3) + ")",
        };
      }

      /**
       * Render pattern-only canvas (no color table).
       * cellCodes: overlay codes on cells; hiRes: fixed large cell;
       * withGrid: force flat cells + grid lines (not bead circles).
       */
      function renderExportCanvas(opts) {
        const o = opts || {};
        const data = exportPatternData();
        if (!data || !lastPalette) return null;
        const cols = data.width;
        const rows = data.height;
        const hiRes = !!o.hiRes || !!o.cellCodes;
        let cell = hiRes
          ? codesExportCellFor(cols, rows)
          : Math.max(4, Math.min(20, +cellEl.value || 8));
        const withGrid = !!o.withGrid;
        const beads = !withGrid && viewEl.value === "beads";
        const off = document.createElement("canvas");
        if (withGrid && FGImage.drawPrintCellGrid) {
          const ink = exportGridColors(o.gridInk);
          FGImage.drawPrintCellGrid(off, data, cell, {
            bg: "#ffffff",
            majorEvery: 0,
            minorColor: ink.minorColor,
            majorColor: ink.majorColor,
          });
        } else if (beads) {
          FGImage.drawBeadGrid(off, data, cell, 1);
        } else {
          FGImage.drawImageData(off, data, cell);
          if (gridEl && gridEl.checked) {
            FGImage.drawGridOverlay(off, cols, rows, cell);
          }
        }
        if (o.cellCodes && FGImage.drawCellCodeOverlay) {
          FGImage.drawCellCodeOverlay(off, data, cell, {
            beads: beads,
            gap: beads ? 1 : 0,
            paletteColors: lastPalette.colors,
            labelFn: cellCodeLabel,
            sharp: true,
          });
        }
        return off;
      }

      function exportSubtitle(data) {
        let total = 0;
        if (lastCounts) Object.values(lastCounts).forEach((n) => (total += n));
        return (
          `${data.width}×${data.height}` +
          (total ? ` · ${total} ${t("perler.stat.beads")}` : "") +
          (lastCounts ? ` · ${Object.keys(lastCounts).length} ${t("perler.stat.colors")}` : "") +
          (lastPalette ? ` · ${FGPalettes.displayName(lastPalette.name)}` : "") +
          (mirrorH ? " · " + t("perler.mirror.toggle") : "")
        );
      }

      /** Pattern + optional color table (legend) below via composePrintSheet. */
      function buildExportSheet(opts) {
        const o = opts || {};
        const data = exportPatternData();
        if (!data || !lastPalette || !FGImage.composePrintSheet) return null;
        const cellCodes = !!o.cellCodes;
        const withGrid = !!o.withGrid;
        const ink = withGrid ? exportGridColors(o.gridInk) : null;
        const cell = cellCodes
          ? Math.min(28, codesExportCellFor(data.width, data.height))
          : Math.max(6, Math.min(14, +cellEl.value || 8));
        return FGImage.composePrintSheet({
          imageData: data,
          palette: lastPalette,
          counts: lastCounts || {},
          cellCodes: cellCodes,
          labelFn: cellCodeLabel,
          printGrid: withGrid,
          cell: cell,
          alignMarks: false,
          majorEvery: 0,
          minorColor: ink && ink.minorColor,
          majorColor: ink && ink.majorColor,
          title: t("perler.printTitle"),
          subtitle: exportSubtitle(data),
          legendTitle: t("perler.printLegend"),
          legendHeaders: [
            t("perler.print.colColor"),
            t("perler.print.colCode"),
            t("perler.print.colCount"),
          ],
          footer: t("perler.printFooter"),
          sheetMode: "both",
        });
      }

      function exportPatternPng(opts) {
        const o = opts || {};
        if (!lastQuantized || !lastPalette) return;
        const withLegend = !!o.withLegend;
        const withGrid = !!o.withGrid;
        const gridInk = o.gridInk;
        FGTool.trackExport(
          "perler",
          "png" + (withLegend ? "_legend" : "") + (withGrid ? "_grid" : "")
        );
        const off = withLegend
          ? buildExportSheet({
              cellCodes: false,
              withGrid: withGrid,
              gridInk: gridInk,
            })
          : renderExportCanvas({
              cellCodes: false,
              hiRes: false,
              withGrid: withGrid,
              gridInk: gridInk,
            });
        if (!off) return;
        FGImage.downloadCanvas(
          off,
          withLegend ? "perler-pattern-legend.png" : "perler-pattern.png"
        );
      }

      function exportCodesPng(opts) {
        const o = opts || {};
        if (!lastQuantized || !lastPalette) return;
        const withLegend = !!o.withLegend;
        const withGrid = !!o.withGrid;
        const gridInk = o.gridInk;
        FGTool.trackExport(
          "perler",
          "png_codes" + (withLegend ? "_legend" : "") + (withGrid ? "_grid" : "")
        );
        const off = withLegend
          ? buildExportSheet({
              cellCodes: true,
              withGrid: withGrid,
              gridInk: gridInk,
            })
          : renderExportCanvas({
              cellCodes: true,
              hiRes: true,
              withGrid: withGrid,
              gridInk: gridInk,
            });
        if (!off) return;
        FGImage.downloadCanvas(
          off,
          withLegend ? "perler-pattern-codes-legend.png" : "perler-pattern-codes.png"
        );
      }

      function exportCsv() {
        if (!lastCounts || !lastPalette) return;
        FGTool.trackExport("perler", "csv");
        const stockOn = isStockEnabled();
        const owned = stockOn ? currentOwnedSet() : null;
        const brand = lastPalette.brand || "";
        const lines = stockOn
          ? ["palette,brand,id,code,name,hex,count,in_stock,missing"]
          : ["palette,brand,id,code,name,hex,count"];
        lastPalette.colors.forEach((c) => {
          const n = lastCounts[c.id] || 0;
          if (!n) return;
          const cn = FGPalettes.colorName(c).replace(/"/g, '""');
          const code = (c.code || "").replace(/"/g, '""');
          if (stockOn) {
            const have = owned.has(c.id) ? "1" : "0";
            const miss = owned.has(c.id) ? "0" : "1";
            lines.push(
              `${lastPalette.id},${brand},${c.id},"${code}","${cn}",${c.hex},${n},${have},${miss}`
            );
          } else {
            lines.push(
              `${lastPalette.id},${brand},${c.id},"${code}","${cn}",${c.hex},${n}`
            );
          }
        });
        FGImage.downloadText(lines.join("\n"), "perler-beads.csv", "text/csv");
      }

      function exportPrint() {
        if (!lastQuantized || !lastPalette || !lastCounts) return;
        /* Print sheets always include the color table; cell overlay is optional. */
        const cellCodes = !!(printCellCodesEl && printCellCodesEl.checked);
        FGTool.trackExport("perler", cellCodes ? "print_codes" : "print_png");
        let total = 0;
        Object.values(lastCounts).forEach((n) => (total += n));
        const tileSize = printTileEl ? Math.max(0, +printTileEl.value || 0) : 0;
        const major = !printMajorEl || printMajorEl.checked;
        const pitch = printPitchEl ? Math.max(2.5, Math.min(10, +printPitchEl.value || 5)) : 5;
        const mmW = (lastQuantized.width * pitch).toFixed(1);
        const mmH = (lastQuantized.height * pitch).toFixed(1);
        const printData =
          mirrorH && FGImage.mirrorImageDataH
            ? FGImage.mirrorImageDataH(lastQuantized)
            : lastQuantized;
        const subtitle =
          `${lastQuantized.width}×${lastQuantized.height} · ${total} ${t("perler.stat.beads")} · ` +
          `${Object.keys(lastCounts).length} ${t("perler.stat.colors")} · ` +
          `${FGPalettes.displayName(lastPalette.name)}` +
          (mirrorH ? " · " + t("perler.mirror.toggle") : "") +
          " · " +
          t("perler.print.pitchNote")
            .replace("{mm}", String(pitch))
            .replace("{w}", mmW)
            .replace("{h}", mmH);
        const legendHeaders = [
          t("perler.print.colColor"),
          t("perler.print.colCode"),
          t("perler.print.colCount"),
        ];
        const pages = FGImage.composePrintBoardPages({
          imageData: printData,
          palette: lastPalette,
          counts: lastCounts,
          tileSize: tileSize,
          cellCodes: cellCodes,
          labelFn: cellCodeLabel,
          printGrid: true,
          majorEvery: major ? 10 : 0,
          alignMarks: true,
          pegPitchMm: pitch,
          cell: cellCodes ? 24 : Math.max(6, Math.min(10, +cellEl.value || 8)),
          title: t("perler.printTitle"),
          subtitle: subtitle,
          legendTitle: t("perler.printLegend"),
          legendHeaders: legendHeaders,
          footer:
            t("perler.printFooter") +
            " · " +
            t(
              pitchFamilyEl && pitchFamilyEl.value === "mini"
                ? "perler.pitch.mini"
                : "perler.pitch.midi"
            ) +
            (structMsg && !structPanel.hidden
              ? " · " + (structMsg.textContent || "")
              : ""),
        });
        FGTool.track(
          "perler",
          "print_pages_" + pages.length + "_tile_" + tileSize
        );
        FGImage.saveCanvases(
          pages.map((sheet, i) => ({
            canvas: sheet,
            filename:
              pages.length === 1
                ? "perler-print-sheet.png"
                : `perler-print-${i + 1}-of-${pages.length}.png`,
          }))
        );
      }

      /** Non-square sources: keep the whole image (contain) instead of center-crop cover. */
      function preferFullFrameFit() {
        if (!sourceImg || !fitEl || activeTplId) return;
        const sw = sourceImg.naturalWidth || sourceImg.width || 1;
        const sh = sourceImg.naturalHeight || sourceImg.height || 1;
        const ratio = sw / sh;
        if (ratio >= 0.9 && ratio <= 1.12) return;
        if (fitEl.value !== "cover") return;
        fitEl.value = "contain";
        if (presetEl && presetEl.value !== "custom") {
          applyingPreset = true;
          presetEl.value = "custom";
          applyingPreset = false;
        }
      }

      function onImageReady() {
        preferFullFrameFit();
        render();
        try {
          previewStage.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (_) { /* ignore */ }
      }

      function tplName(tpl) {
        if (!tpl) return "";
        return t(tpl.nameKey || "perler.tpl." + tpl.id);
      }

      function paintTplThumbs() {
        if (!FGPerlerTemplates || !tplGrid) return;
        const list = FGPerlerTemplates.list("all");
        tplGrid.innerHTML = "";
        list.forEach((tpl) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tpl__item tpl__item--photo" + (activeTplId === tpl.id ? " is-active" : "");
          btn.setAttribute("data-tpl", tpl.id);
          const thumb = document.createElement("img");
          thumb.className = "tpl__thumb";
          thumb.alt = "";
          thumb.loading = "lazy";
          thumb.src = FGPerlerTemplates.thumbSrc(tpl);
          const label = document.createElement("span");
          label.textContent = tplName(tpl);
          btn.appendChild(thumb);
          btn.appendChild(label);
          btn.addEventListener("click", () => loadTemplate(tpl.id));
          tplGrid.appendChild(btn);
        });
      }

      function paintTplTabs() {
        if (!tplTabs) return;
        // Single photo template — no category tabs needed
        tplTabs.hidden = true;
        tplTabs.innerHTML = "";
      }

      async function loadTemplate(id) {
        const tpl = FGPerlerTemplates && FGPerlerTemplates.get(id);
        if (!tpl) return;
        try {
          sourceImg = await FGPerlerTemplates.toImage(tpl);
          fromTemplate = false; // real photo: smooth downscale + photo preset
          activeTplId = id;
          activeTplCat = tpl.cat;
          sourceCropRect = null;
          syncCropUi();
          importBanner.hidden = true;
          nameEl.value = tplName(tpl).slice(0, 40) || id;
          applyPreset("photo");
          tipKey = "perler.tip.template";
          tip.setAttribute("data-i18n", tipKey);
          tip.textContent = t(tipKey);
          paintTplThumbs();
          FGTool.track("perler", "template_" + id);
          onImageReady();
        } catch (e) {
          stats.textContent = e.message || t("common.loadFail");
        }
      }

      FGImage.setupDropzone(drop, async (file) => {
        try {
          sourceImg = await FGImage.loadImageFromFile(file);
          fromTemplate = false;
          activeTplId = null;
          sourceCropRect = null;
          syncCropUi();
          paintTplThumbs();
          importBanner.hidden = true;
          onImageReady();
        } catch (e) {
          stats.textContent = e.message || t("common.loadFail");
          setExportEnabled(false);
          beadSummary.hidden = true;
        }
      }, { wxTip: t("common.wxTip") });

      presetEl.addEventListener("change", () => {
        if (presetEl.value !== "custom") applyPreset(presetEl.value);
        render();
      });

      // These regenerate quantization (clears edits / undo)
      [sideEl, fitEl, palEl, nEl, ditherEl, contrastEl, satEl].forEach((el) => {
        el.addEventListener("input", () => {
          markCustom();
          syncNField();
          if (el === palEl) paintStockSwatches();
          render();
        });
        el.addEventListener("change", () => {
          markCustom();
          syncNField();
          if (el === palEl) paintStockSwatches();
          render();
        });
      });
      if (ditherEl && (ditherEl.value === "region" || ditherEl.value === "logo")) {
        ditherEl.value = "fs";
      }
      if (presetEl && (presetEl.value === "illustration" || presetEl.value === "logo")) {
        presetEl.value = "custom";
      }

      function persistStockUi() {
        try {
          localStorage.setItem(
            "fg.beadStockUi.v1",
            JSON.stringify({
              enabled: !!(stockEnabledEl && stockEnabledEl.checked),
              only: !!(stockOnlyEl && stockOnlyEl.checked),
            })
          );
        } catch (_) { /* ignore */ }
      }

      function loadStockUi() {
        try {
          const u = JSON.parse(localStorage.getItem("fg.beadStockUi.v1") || "{}");
          if (stockEnabledEl && typeof u.enabled === "boolean") stockEnabledEl.checked = u.enabled;
          if (stockOnlyEl && typeof u.only === "boolean") stockOnlyEl.checked = u.only;
        } catch (_) { /* ignore */ }
      }

      if (stockEnabledEl) {
        stockEnabledEl.addEventListener("change", () => {
          persistStockUi();
          const side = document.getElementById("bead-side");
          const scrollTop = side ? side.scrollTop : 0;
          syncStockSwatchState();
          if (isStockOnly() && sourceImg) render();
          else if (lastCounts) {
            updateStockMissing(lastCounts, lastPalette);
            // Legend missing tags only — avoid full refreshFromQuantized scroll jank.
            if (lastQuantized) refreshFromQuantized();
          } else updateStockMissing(null, null);
          if (side) side.scrollTop = scrollTop;
          FGTool.track("perler", stockEnabledEl.checked ? "stock_on" : "stock_off");
        });
      }
      if (stockOnlyEl) {
        stockOnlyEl.addEventListener("change", () => {
          persistStockUi();
          if (sourceImg) render();
          FGTool.track("perler", stockOnlyEl.checked ? "stock_only_on" : "stock_only_off");
        });
      }
      if (btnStockAll) {
        btnStockAll.addEventListener("click", () => {
          const id = stockPaletteId();
          if (!id) return;
          const pal = FGPalettes.byId(id);
          FGBeadStock.setOwnedIds(
            id,
            pal.colors.map((c) => c.id)
          );
          syncStockSwatchState();
          if (lastCounts) updateStockMissing(lastCounts, lastPalette);
        });
      }
      if (btnStockNone) {
        btnStockNone.addEventListener("click", () => {
          const id = stockPaletteId();
          if (!id) return;
          FGBeadStock.setOwnedIds(id, []);
          syncStockSwatchState();
          if (lastCounts) updateStockMissing(lastCounts, lastPalette);
        });
      }
      // Preview-only: keep edited grid
      [viewEl, cellEl, gridEl].forEach((el) => {
        el.addEventListener("input", () => {
          markCustom();
          if (lastQuantized) refreshFromQuantized();
          else render();
        });
        el.addEventListener("change", () => {
          markCustom();
          if (lastQuantized) refreshFromQuantized();
          else render();
        });
      });

      document.querySelectorAll(".edit-tool").forEach((btn) => {
        btn.addEventListener("click", () => {
          setEditTool(btn.getAttribute("data-edit"), { toggle: true });
        });
      });
      if (btnEditUndo) btnEditUndo.addEventListener("click", undoEdit);
      if (btnSparseMerge) btnSparseMerge.addEventListener("click", mergeSparseEdit);
      if (sparseThrEl) {
        sparseThrEl.addEventListener("change", () => {
          let v = +sparseThrEl.value;
          if (!Number.isFinite(v)) v = 5;
          sparseThrEl.value = String(Math.max(1, Math.min(20, Math.round(v))));
        });
      }

      function craftPointerClient(e) {
        if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        if (e.changedTouches && e.changedTouches[0]) {
          return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function onViewPanStart(e) {
        if (!panArmed || !lastQuantized) return false;
        viewPanning = true;
        syncViewportCursor();
        const p = craftPointerClient(e);
        viewPanLast = { x: p.x, y: p.y };
        e.preventDefault();
        return true;
      }

      function onViewPanMove(e) {
        if (!viewPanning || !viewPanLast) return;
        const p = craftPointerClient(e);
        viewPanX += p.x - viewPanLast.x;
        viewPanY += p.y - viewPanLast.y;
        viewPanLast = { x: p.x, y: p.y };
        applyViewTransform();
        e.preventDefault();
      }

      function onViewPanEnd() {
        viewPanning = false;
        viewPanLast = null;
        syncViewportCursor();
      }

      if (craftViewport) {
        craftViewport.addEventListener("mousedown", (e) => {
          if (onViewPanStart(e)) return;
        });
        craftViewport.addEventListener(
          "touchstart",
          (e) => {
            if (onViewPanStart(e)) return;
          },
          { passive: false }
        );
        craftViewport.addEventListener(
          "wheel",
          (e) => {
            if (!lastQuantized) return;
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
            setViewScale(viewScale * factor);
          },
          { passive: false }
        );
      }
      window.addEventListener("mousemove", (e) => onViewPanMove(e));
      window.addEventListener("mouseup", onViewPanEnd);
      window.addEventListener(
        "touchmove",
        (e) => {
          if (viewPanning) onViewPanMove(e);
        },
        { passive: false }
      );
      window.addEventListener("touchend", onViewPanEnd);

      function tryCraftPinAt(e) {
        if (!craftMode || panArmed || viewPanning) return false;
        const cell = cellFromEventVisual(e);
        if (!cell) {
          if (craftAxisOn) clearCraftPin();
          return craftAxisOn;
        }
        /* Click a bead: toggle placed progress + pin */
        if (toggleCellPlaced(cell.x, cell.y)) {
          syncCraftDoneIdsFromPlaced();
          saveCraftProgressNow();
        }
        craftPin = { x: cell.x, y: cell.y };
        craftStepFromNav = false;
        rebuildCraftStepList();
        const idx = craftStepList.findIndex(
          (c) => c.x === cell.x && c.y === cell.y
        );
        craftStepIndex = idx;
        if (!craftAxisOn) setCraftAxisOn(true);
        else syncCraftAxisUi();
        syncCraftStepUi();
        paintLegend(lastCounts || {});
        drawPatternCanvas();
        FGTool.track("perler", "craft_place_toggle");
        e.preventDefault();
        return true;
      }

      canvas.addEventListener("mousedown", (e) => {
        if (tryCraftPinAt(e)) return;
        if (craftMode) return;
        if (cutoutMode) {
          const cell = cellFromEvent(e);
          if (!cell) return;
          cutoutPainting = true;
          paintCutoutAt(cell.x, cell.y);
          e.preventDefault();
          return;
        }
        if (!canEditCanvas()) return;
        const cell = cellFromEvent(e);
        if (!cell) return;
        editPainting = editTool === "paint" || editTool === "eraser";
        editStrokeDirty = false;
        applyEditAt(cell.x, cell.y, { stroke: editPainting });
        e.preventDefault();
      });
      window.addEventListener("mouseup", () => {
        editPainting = false;
        editStrokeDirty = false;
        cutoutPainting = false;
      });
      canvas.addEventListener("mousemove", (e) => {
        if (cutoutMode && cutoutPainting) {
          const cell = cellFromEvent(e);
          if (cell) paintCutoutAt(cell.x, cell.y);
          return;
        }
        if (craftMode || !editPainting || !canEditCanvas()) return;
        const cell = cellFromEvent(e);
        if (!cell) return;
        applyEditAt(cell.x, cell.y, { stroke: true });
      });
      canvas.addEventListener(
        "touchstart",
        (e) => {
          if (tryCraftPinAt(e)) return;
          if (craftMode) return;
          if (cutoutMode) {
            const cell = cellFromEvent(e);
            if (!cell) return;
            cutoutPainting = true;
            paintCutoutAt(cell.x, cell.y);
            e.preventDefault();
            return;
          }
          if (!canEditCanvas()) return;
          const cell = cellFromEvent(e);
          if (!cell) return;
          editPainting = editTool === "paint" || editTool === "eraser";
          editStrokeDirty = false;
          applyEditAt(cell.x, cell.y, { stroke: editPainting });
          e.preventDefault();
        },
        { passive: false }
      );
      canvas.addEventListener(
        "touchmove",
        (e) => {
          if (cutoutMode && cutoutPainting) {
            const cell = cellFromEvent(e);
            if (cell) paintCutoutAt(cell.x, cell.y);
            e.preventDefault();
            return;
          }
          if (craftMode || !editPainting || !canEditCanvas()) return;
          const cell = cellFromEvent(e);
          if (!cell) return;
          applyEditAt(cell.x, cell.y, { stroke: true });
          e.preventDefault();
        },
        { passive: false }
      );
      canvas.addEventListener("touchend", () => {
        editPainting = false;
        editStrokeDirty = false;
        cutoutPainting = false;
      });

      if (btnCraft) {
        btnCraft.addEventListener("click", () => setCraftMode(!craftMode));
      }
      if (btnCraftAxis) {
        btnCraftAxis.addEventListener("click", () => {
          setCraftAxisOn(!craftAxisOn);
          FGTool.track("perler", craftAxisOn ? "craft_axis_on" : "craft_axis_off");
        });
      }
      if (btnDraftToggle) {
        btnDraftToggle.addEventListener("click", () => {
          if (!lastQuantized) return;
          const open = draftPanel && draftPanel.hidden;
          setDraftPanelOpen(!!open);
          if (open) paintDraftList();
        });
      }
      if (btnDraftSave) {
        btnDraftSave.addEventListener("click", () => saveDraft());
      }
      document.addEventListener("click", (e) => {
        const wrap = document.getElementById("craft-draft-wrap");
        if (!wrap || !draftPanel || draftPanel.hidden) return;
        if (wrap.contains(e.target)) return;
        setDraftPanelOpen(false);
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && craftPin) {
          clearCraftPin();
          return;
        }
        if (!craftMode || !lastQuantized) return;
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (e.key === "]" || e.key === "Period" || e.key === ".") {
          e.preventDefault();
          goCraftStep(1);
        } else if (e.key === "[" || e.key === "Comma" || e.key === ",") {
          e.preventDefault();
          goCraftStep(-1);
        }
      });
      if (typeof ResizeObserver !== "undefined" && craftViewport) {
        const axisRo = new ResizeObserver(() => syncCraftAxisUi());
        axisRo.observe(craftViewport);
      }
      document.querySelectorAll(".craft-mode").forEach((btn) => {
        btn.addEventListener("click", () => {
          setCraftGuide(btn.getAttribute("data-craft-mode") || "color");
          FGTool.track("perler", "craft_mode_" + craftGuide);
        });
      });
      function nudgeCraftRange(delta) {
        if (!lastQuantized) return;
        if (craftGuide === "row") {
          const h = lastQuantized.height;
          const order = [];
          for (let y = 0; y < h; y++) order.push(y);
          if (craftMirrorV) order.reverse();
          let i = order.indexOf(craftRow);
          if (i < 0) i = 0;
          i = Math.max(0, Math.min(order.length - 1, i + delta));
          craftRow = order[i];
        } else if (craftGuide === "column") {
          const w = lastQuantized.width;
          const order = [];

          const zones = (layout && layout.zones) || [];
          if (!zones.length) return;
          const curKey = FGBeadPlaceZones.zoneKey(
            craftFocusZone.zr,
            craftFocusZone.zc
          );
          let i = zones.findIndex((z) => z.key === curKey);
          if (i < 0) i = 0;
          i = Math.max(0, Math.min(zones.length - 1, i + delta));

      /** Tiny 4×2 swatch so slider changes are obvious. */
      function paintExportInkPreview(ink) {
        if (!pickInkPreview) return;
        const cols = 4;
        const rows = 2;
        const cell = 42;
        const w = cols * cell;
        const h = rows * cell;
        if (pickInkPreview.width !== w) pickInkPreview.width = w;
        if (pickInkPreview.height !== h) pickInkPreview.height = h;
        const ctx = pickInkPreview.getContext("2d");
        const fills = ["#f4a6c1", "#ffe566", "#7ec8e3", "#b8e986", "#c9b1ff", "#ffb347", "#90e0c0", "#ff8fab"];
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            ctx.fillStyle = fills[y * cols + x];
            ctx.fillRect(x * cell, y * cell, cell, cell);
          }
        }
        const inkColors = exportGridColors(ink);
        ctx.strokeStyle = inkColors.minorColor;
        ctx.lineWidth = 1;
        for (let x = 0; x <= cols; x++) {
          ctx.beginPath();
          ctx.moveTo(x * cell + 0.5, 0);
          ctx.lineTo(x * cell + 0.5, h);
          ctx.stroke();
        }
        for (let y = 0; y <= rows; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * cell + 0.5);
          ctx.lineTo(w, y * cell + 0.5);
          ctx.stroke();
        }
      }

        pickInkEl.value = String(v);

        if (pickInkLabel) {
          let key = "perler.export.gridInkMid";
          if (v < 34) key = "perler.export.gridInkLight";
          else if (v > 66) key = "perler.export.gridInkDark";
          pickInkLabel.textContent = t(key);
        }
        if (on) paintExportInkPreview(v);
      }

          importBanner.hidden = false;
          if (h.meta && h.meta.paletteId && h.meta.paletteId !== "auto") {
            applyingPreset = true;
            presetEl.value = "custom";
            palEl.value = h.meta.paletteId;
            applyingPreset = false;
            syncNField();
            showPaletteBanner(h.meta.paletteId);
          }
          onImageReady();
        } catch (_) { /* ignore */ }
      })();

      window.addEventListener("pagehide", () => {
        if (craftProgressDirty || craftPlaced.size) saveCraftProgressNow();
      });
      window.addEventListener("beforeunload", () => {
        if (craftProgressDirty || craftPlaced.size) saveCraftProgressNow();
      });
    })();
  </script>
</body>
</html>
