      let craftStepFromNav = false;
      /* Camera: translate(pan) scale(scale) on #craft-stage, origin top-left */
      let viewScale = 1;
      let viewPanX = 0;
      let viewPanY = 0;
      let panArmed = false;
      let viewPanning = false;
      let viewPanLast = null;
      let lastViewFitKey = "";
      let homeViewScale = 1;
      let homeViewPanX = 0;
      let homeViewPanY = 0;
      let showCellCodes = false;

      function syncRmBgUi() {
        const ready = !!lastQuantizedBase || !!lastQuantized;
        if (btnRmBg) {
          btnRmBg.disabled = !ready || cutoutMode;
          btnRmBg.classList.toggle("is-active", rmBgOn);
          btnRmBg.setAttribute("aria-pressed", rmBgOn ? "true" : "false");
        }
        if (rmBgTolEl) {
          rmBgTolEl.disabled = !rmBgOn || cutoutMode;
          if (rmBgTolVal) rmBgTolVal.textContent = String(+rmBgTolEl.value || 36);
        }
      }

      function applyRmBgFromBase() {
        if (!lastQuantizedBase || !lastPalette) return;
        if (rmBgOn && FGImage.removeBackgroundEdgeFlood) {
          const tol = rmBgTolEl ? Math.max(8, Math.min(96, +rmBgTolEl.value || 36)) : 36;
          lastQuantized = FGImage.removeBackgroundEdgeFlood(lastQuantizedBase, {
            tolerance: tol,
          });
        } else {
          lastQuantized = cloneImageData(lastQuantizedBase);
        }
        applyEraseMaskTo(lastQuantized);
        clearUndo();
        craftDoneIds = new Set();
        craftFocusId = null;
        lastViewFitKey = "";
        refreshFromQuantized();
        syncRmBgUi();
        syncEraseUi();
      }

      function exitCutoutMode(redraw) {
        cutoutMode = false;
        cutoutMask = null;
        cutoutPainting = false;
        syncCutoutUi();
        if (redraw !== false) drawPatternCanvas();
        syncPreviewToggles();
      }

      function enterCutoutMode() {
        if (!lastQuantizedBase && !lastQuantized) return;
        if (craftMode) setCraftMode(false);
        if (editArmed) setEditArmed(false);
        if (!lastQuantizedBase && lastQuantized) {
          lastQuantizedBase = cloneImageData(lastQuantized);
        }
        cutoutMode = true;
        cutoutTool = "keep";
        cutoutMask = FGImage.initKeepMask
          ? FGImage.initKeepMask(lastQuantizedBase)
          : new Uint8Array(lastQuantizedBase.width * lastQuantizedBase.height);
        syncCutoutUi();
        syncPreviewToggles();
        drawPatternCanvas();
        FGTool.track("perler", "cutout_on");
      }

      function paintCutoutAt(x, y) {
        if (!cutoutMode || !cutoutMask || !lastQuantizedBase) return;
        const w = lastQuantizedBase.width;
        const h = lastQuantizedBase.height;
        const r = cutoutBrushEl ? Math.max(1, Math.min(8, +cutoutBrushEl.value || 3)) : 3;
        const value = cutoutTool !== "erase";
        if (FGImage.paintMaskDisk) {
          FGImage.paintMaskDisk(cutoutMask, w, h, x, y, r, value);
        } else {
          const idx = y * w + x;
          if (idx >= 0 && idx < cutoutMask.length) cutoutMask[idx] = value ? 1 : 0;
        }
        drawPatternCanvas();
      }

      function applyCutoutMask() {
        if (!cutoutMode || !cutoutMask || !lastQuantizedBase) return;
        lastQuantizedBase = FGImage.applyKeepMask
          ? FGImage.applyKeepMask(lastQuantizedBase, cutoutMask)
          : lastQuantizedBase;
        clearEraseMask();
        exitCutoutMode(false);
        applyRmBgFromBase();
        FGTool.track("perler", "cutout_apply");
      }

      function clampCropDraft(draft, sw, sh, square) {
        let w = Math.max(8, Math.round(draft.w));
        let h = Math.max(8, Math.round(draft.h));
        if (square) {
          const side = Math.min(w, h, sw, sh);
          w = side;
          h = side;
        } else {
          w = Math.min(w, sw);
          h = Math.min(h, sh);
        }
        let x = Math.round(draft.x);
        let y = Math.round(draft.y);
        x = Math.max(0, Math.min(sw - w, x));
        y = Math.max(0, Math.min(sh - h, y));
        return { x, y, w, h };
      }

      function defaultCropDraft(sw, sh, square) {
        if (square) {
          const side = Math.min(sw, sh);
          return {
            x: Math.round((sw - side) / 2),
            y: Math.round((sh - side) / 2),
            w: side,
            h: side,
          };
        }
        return { x: 0, y: 0, w: sw, h: sh };
      }

      function layoutCropStage() {
        if (!sourceImg || !cropStage || !cropCanvas) return null;
        const sw = sourceImg.naturalWidth || sourceImg.width;
        const sh = sourceImg.naturalHeight || sourceImg.height;
        /* Must run while modal is visible — hidden stage rect is wrong / 0. */
        const rect = cropStage.getBoundingClientRect();
        const stageW = Math.max(1, rect.width || 360);
        const stageH = Math.max(1, rect.height || stageW);
        const scale = Math.min(stageW / sw, stageH / sh);
        const imgW = sw * scale;
        const imgH = sh * scale;
        const imgL = (stageW - imgW) / 2;
        const imgT = (stageH - imgH) / 2;
        const cw = Math.max(1, Math.round(stageW));
        const ch = Math.max(1, Math.round(stageH));
        cropCanvas.width = cw;
        cropCanvas.height = ch;
        const ctx = cropCanvas.getContext("2d");
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#0d1218";
        ctx.fillRect(0, 0, cw, ch);
        ctx.imageSmoothingEnabled = true;
        /* Draw in CSS-pixel space mapped onto bitmap (cw×ch ≈ stageW×stageH). */
        const sx = cw / stageW;
        const sy = ch / stageH;
        ctx.drawImage(
          sourceImg,
          imgL * sx,
          imgT * sy,
          imgW * sx,
          imgH * sy
        );
        cropLayout = { sw, sh, scale, imgL, imgT, imgW, imgH, stageW, stageH };
        return cropLayout;
      }

      function syncCropBoxDom() {
        if (!cropBox || !cropLayout || !cropDraft) {
          if (cropBox) cropBox.hidden = true;
          return;
        }
        const { scale, imgL, imgT } = cropLayout;
        cropBox.hidden = false;
        cropBox.style.left = imgL + cropDraft.x * scale + "px";
        cropBox.style.top = imgT + cropDraft.y * scale + "px";
        cropBox.style.width = Math.max(1, cropDraft.w * scale) + "px";
        cropBox.style.height = Math.max(1, cropDraft.h * scale) + "px";
      }

      function syncCropShapeButtons() {
        if (cropShapeSquare) {
          cropShapeSquare.classList.toggle("is-active", cropLockSquare);
          cropShapeSquare.setAttribute("aria-pressed", cropLockSquare ? "true" : "false");
        }
        if (cropShapeFree) {
          cropShapeFree.classList.toggle("is-active", !cropLockSquare);
          cropShapeFree.setAttribute("aria-pressed", !cropLockSquare ? "true" : "false");
        }
      }

      function refreshCropModalLayout(opts) {
        const o = opts || {};
        const lay = layoutCropStage();
        if (!lay) return null;
        if (o.resetDraft || !cropDraft) {
          cropDraft = clampCropDraft(
            o.draft ||
              sourceCropRect ||
              defaultCropDraft(lay.sw, lay.sh, cropLockSquare),
            lay.sw,
            lay.sh,
            cropLockSquare
          );
        } else {
          cropDraft = clampCropDraft(
            cropDraft,
            lay.sw,
            lay.sh,
            cropLockSquare
          );
        }
        syncCropBoxDom();
        return lay;
      }

      function openCropModal() {
        if (!sourceImg || !cropModal) return;
        cropLockSquare = true;
        syncCropShapeButtons();
        cropModal.hidden = false;
        /* Wait for layout: hidden→shown rect is only valid after paint. */
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            refreshCropModalLayout({
              resetDraft: true,
              draft: sourceCropRect || null,
            });
          });
        });
        FGTool.track("perler", "crop_open");
      }

      function closeCropModal() {
        if (cropModal) cropModal.hidden = true;
        cropDrag = null;
      }

      function cropLocalXY(e) {
        if (!cropStage) return null;
        const pt = e.touches && e.touches[0] ? e.touches[0] : e;
        const rect = cropStage.getBoundingClientRect();
        return { x: pt.clientX - rect.left, y: pt.clientY - rect.top };
      }

      function beginCropDrag(e, handle) {
        if (!cropDraft || !cropLayout) return;
        const local = cropLocalXY(e);
        if (!local) return;
        cropDrag = {
          mode: handle || "move",
          x: local.x,
          y: local.y,
          ox: cropDraft.x,
          oy: cropDraft.y,
          ow: cropDraft.w,
          oh: cropDraft.h,
        };
        e.preventDefault();
      }

      function moveCropDrag(e) {
        if (!cropDrag || !cropDraft || !cropLayout) return;
        const local = cropLocalXY(e);
        if (!local) return;
        const dx = (local.x - cropDrag.x) / cropLayout.scale;
        const dy = (local.y - cropDrag.y) / cropLayout.scale;
        let next;
        if (cropDrag.mode === "br") {
          if (cropLockSquare) {
            const delta = Math.max(dx, dy);
            next = {
              x: cropDrag.ox,
              y: cropDrag.oy,
              w: cropDrag.ow + delta,
              h: cropDrag.oh + delta,
            };
          } else {
            next = {
              x: cropDrag.ox,
              y: cropDrag.oy,
              w: cropDrag.ow + dx,
              h: cropDrag.oh + dy,
            };
          }
        } else if (cropDrag.mode === "bl") {
          if (cropLockSquare) {
            const delta = Math.max(-dx, dy);
            const side = cropDrag.ow + delta;
            next = {
              x: cropDrag.ox + cropDrag.ow - side,
              y: cropDrag.oy,
              w: side,
              h: side,
            };
          } else {
            next = {
              x: cropDrag.ox + dx,
              y: cropDrag.oy,
              w: cropDrag.ow - dx,
              h: cropDrag.oh + dy,
            };
          }
        } else {
          next = {
            x: cropDrag.ox + dx,
            y: cropDrag.oy + dy,
            w: cropDrag.ow,
            h: cropDrag.oh,
          };
        }
        cropDraft = clampCropDraft(next, cropLayout.sw, cropLayout.sh, cropLockSquare);
        syncCropBoxDom();
        e.preventDefault();
      }

      function endCropDrag() {
        cropDrag = null;
      }

      function syncEraseUi() {
        const ready = !!lastQuantized;
        const eraseOn = editArmed && editTool === "eraser";
        const fillOn = editArmed && editTool === "erase-fill";
        if (btnErase) {
          btnErase.disabled = !ready || craftMode || cutoutMode;
          btnErase.classList.toggle("is-active", eraseOn);
          btnErase.setAttribute("aria-pressed", eraseOn ? "true" : "false");
        }
        if (btnEraseFill) {
          btnEraseFill.disabled = !ready || craftMode || cutoutMode;
          btnEraseFill.classList.toggle("is-active", fillOn);
          btnEraseFill.setAttribute("aria-pressed", fillOn ? "true" : "false");
        }
        if (eraseBrushVal && eraseBrushEl) {
          eraseBrushVal.textContent = String(+eraseBrushEl.value || 1);
        }
      }
      let mirrorH = false;

      function syncViewportCursor() {
        if (!craftViewport) return;
        craftViewport.classList.toggle("is-pan-armed", panArmed && !!lastQuantized);
        craftViewport.classList.toggle("is-panning", viewPanning);
        craftViewport.classList.toggle(
          "is-erase-armed",
          !!lastQuantized && editArmed && isEraseTool(editTool) && !panArmed
        );
      }

      function syncCutoutUi() {
        const ready = !!lastQuantized || !!lastQuantizedBase;
        if (btnCutout) {
          btnCutout.disabled = !ready || craftMode;
          btnCutout.classList.toggle("is-active", cutoutMode);
          btnCutout.setAttribute("aria-pressed", cutoutMode ? "true" : "false");
        }
        if (cutoutDock) cutoutDock.hidden = !cutoutMode;
        if (btnCutoutKeep) {
          btnCutoutKeep.classList.toggle("is-active", cutoutTool === "keep");
          btnCutoutKeep.setAttribute("aria-pressed", cutoutTool === "keep" ? "true" : "false");
        }
        if (btnCutoutErase) {
          btnCutoutErase.classList.toggle("is-active", cutoutTool === "erase");
          btnCutoutErase.setAttribute("aria-pressed", cutoutTool === "erase" ? "true" : "false");
        }
        if (cutoutBrushVal && cutoutBrushEl) {
          cutoutBrushVal.textContent = String(+cutoutBrushEl.value || 3);
        }
      }

      function syncCropUi() {
        if (btnCrop) {
          btnCrop.disabled = !sourceImg;
          btnCrop.classList.toggle("is-active", !!sourceCropRect);
          btnCrop.title = sourceCropRect ? t("perler.crop.active") : t("perler.crop.open");
        }
      }

      function syncCleanUi() {
        if (btnCleanIslands) btnCleanIslands.disabled = !lastQuantized || cutoutMode;
      }

      function syncPreviewToggles() {
        const ready = !!lastQuantized;
        if (btnShowCodes) {
          btnShowCodes.disabled = !ready || cutoutMode;
          btnShowCodes.classList.toggle("is-active", showCellCodes);
          btnShowCodes.setAttribute("aria-pressed", showCellCodes ? "true" : "false");
        }
        syncRmBgUi();
        syncEraseUi();
        syncCutoutUi();
        syncCropUi();
        syncCleanUi();
        if (btnMirror) {
          btnMirror.disabled = !ready || cutoutMode;
          btnMirror.classList.toggle("is-active", mirrorH);
          btnMirror.setAttribute("aria-pressed", mirrorH ? "true" : "false");
        }
        if (btnPan) {
          btnPan.disabled = !ready;
          btnPan.classList.toggle("is-active", panArmed);
          btnPan.setAttribute("aria-pressed", panArmed ? "true" : "false");
        }
        const pct = Math.round(viewScale * 100);
        if (zoomPct) zoomPct.textContent = pct + "%";
        if (zoomSlider) {
          zoomSlider.disabled = !ready;
          zoomSlider.value = String(Math.max(25, Math.min(400, pct)));
          zoomSlider.title = t("perler.zoom.hint");
        }
        if (btnZoomReset) {
          btnZoomReset.disabled = !ready;
          btnZoomReset.title = t("perler.zoom.reset");
        }
        syncViewportCursor();
      }

      /** Logical bead size (before zoom). Fit/pan math uses this, not the hi-res bitmap. */
      function boardMetrics() {
        const cols = lastQuantized ? lastQuantized.width : 1;
        const rows = lastQuantized ? lastQuantized.height : 1;
        const baseCell = Math.max(4, Math.min(20, +cellEl.value || 8));
        const beads = viewEl.value === "beads";
        const gap = beads ? 1 : 0;
        const step = baseCell + gap;
        return {
          cols,
          rows,
          baseCell,
          beads,
          gap,
          w: cols * step - (gap ? gap : 0),
          h: rows * step - (gap ? gap : 0),
        };
      }

      function cssViewScale() {
        /* Codes bake zoom into the bitmap; CSS scale stays 1. */
        return showCellCodes ? 1 : viewScale;
      }

      function applyViewTransform() {
        if (!craftStage) return;
        const scale = cssViewScale();
        craftStage.style.transform =
          "translate(" + viewPanX + "px," + viewPanY + "px) scale(" + scale + ")";
        syncCraftAxisUi();
      }

      function viewportSize() {
        if (!craftViewport) return { vw: 1, vh: 1 };
        return {
          vw: Math.max(1, craftViewport.clientWidth || 1),
          vh: Math.max(1, craftViewport.clientHeight || 1),
        };
      }

      /** Unscaled bitmap px of a cell center (matches drawBeadGrid / drawImageData). */
      function cellCenterBitmap(cx, cy) {
        const m = boardMetrics();
        const gap = m.beads ? 1 : 0;
        const step = m.baseCell + gap;
        return {
          x: cx * step + m.baseCell * 0.5,
          y: cy * step + m.baseCell * 0.5,
        };
      }

      function setCraftAxisOn(on) {
        craftAxisOn = !!on;
        if (btnCraftAxis) {
          btnCraftAxis.classList.toggle("is-active", craftAxisOn);
          btnCraftAxis.setAttribute("aria-pressed", craftAxisOn ? "true" : "false");
          btnCraftAxis.title = t("perler.craft.axisHint");
        }
        syncCraftAxisUi();
      }

      function clearCraftPin() {
        craftPin = null;
        craftStepFromNav = false;
        syncCraftAxisUi();
        syncCraftStepUi();
      }

      function ensureCraftZoneLayout() {
        if (!lastQuantized || !window.FGBeadPlaceZones) {
          craftZoneLayout = null;
          return null;
        }
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        if (
          craftZoneLayout &&
          craftZoneLayout.zoneSize === craftZoneSize &&
          craftZoneLayout._w === w &&
          craftZoneLayout._h === h
        ) {
          return craftZoneLayout;
        }
        craftZoneLayout = FGBeadPlaceZones.buildZoneLayout(w, h, craftZoneSize);
        craftZoneLayout._w = w;
        craftZoneLayout._h = h;
        return craftZoneLayout;
      }

      function toCraftViewXY(x, y) {
        if (!lastQuantized) return { x: x, y: y };
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        return {
          x: craftMirrorH ? w - 1 - x : x,
          y: craftMirrorV ? h - 1 - y : y,
        };
      }

      function sortCraftStepsByView(list) {
        return list.slice().sort((a, b) => {
          const va = toCraftViewXY(a.x, a.y);
          const vb = toCraftViewXY(b.x, b.y);
          if (va.y !== vb.y) return va.y - vb.y;
          return va.x - vb.x;
        });
      }

      function buildCraftStepList() {
        const list = [];
        if (!lastQuantized || !lastPalette) return list;
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        const d = lastQuantized.data;
        const rgbToId = Object.create(null);
        lastPalette.colors.forEach((c) => {
          const rgb = c.rgb || FGPalettes.hexToRgb(c.hex);
          if (!rgb) return;
          rgbToId[rgb[0] + "," + rgb[1] + "," + rgb[2]] = c.id;
        });
        const rangeGuide =
          craftGuide === "row" ||
          craftGuide === "column" ||
          craftGuide === "zone";
        const focusId = rangeGuide ? null : craftFocusId;
        let x0 = 0;
        let x1 = w - 1;
        let y0 = 0;
        let y1 = h - 1;
        if (craftGuide === "row") {
          y0 = y1 = craftRow;
        } else if (craftGuide === "column") {
          x0 = x1 = craftCol;
        } else if (craftGuide === "zone") {
          const layout = ensureCraftZoneLayout();
          const z =
            layout &&
            FGBeadPlaceZones.getZone(
              layout,
              craftFocusZone.zr,
              craftFocusZone.zc
            );
          if (!z) return list;
          x0 = z.x0;
          x1 = z.x1;
          y0 = z.y0;
          y1 = z.y1;
        }
        for (let y = y0; y <= y1; y++) {
          for (let vx = x0; vx <= x1; vx++) {
            const sx = mirrorH ? w - 1 - vx : vx;
            const i = (y * w + sx) * 4;
            if (d[i + 3] < 16) continue;
            const id = rgbToId[d[i] + "," + d[i + 1] + "," + d[i + 2]] || 0;
            if (!id) continue;
            if (focusId != null && !colorIdEq(id, focusId)) continue;
            if (isCellPlaced(vx, y)) continue;
            list.push({ x: vx, y: y, id: id });
          }
        }
        return sortCraftStepsByView(list);
      }

      /** Advance row/col/zone when current range has no beads left. */
      function promoteCraftRangeIfEmpty() {
        if (!lastQuantized) return false;
        if (craftGuide === "row") {
          const h = lastQuantized.height;
          const order = [];
          for (let y = 0; y < h; y++) order.push(y);
          if (craftMirrorV) order.reverse();
          const idx = order.indexOf(craftRow);
          for (let i = idx + 1; i < order.length; i++) {
            craftRow = order[i];
            if (buildCraftStepList().length) return true;
          }
          return false;
        }
        if (craftGuide === "column") {
          const w = lastQuantized.width;
          const order = [];
          for (let x = 0; x < w; x++) order.push(x);
          if (craftMirrorH) order.reverse();
          const idx = order.indexOf(craftCol);
          for (let i = idx + 1; i < order.length; i++) {
            craftCol = order[i];
            if (buildCraftStepList().length) return true;
          }
          return false;
        }
        if (craftGuide === "zone") {
          const layout = ensureCraftZoneLayout();
          const zones = (layout && layout.zones) || [];
          if (!zones.length) return false;
          const curKey = FGBeadPlaceZones.zoneKey(
            craftFocusZone.zr,
            craftFocusZone.zc
          );
          let start = zones.findIndex((z) => z.key === curKey);
          if (start < 0) start = -1;
          for (let i = start + 1; i < zones.length; i++) {
            craftFocusZone = { zr: zones[i].zr, zc: zones[i].zc };
            if (buildCraftStepList().length) return true;
          }
          return false;
        }
        return false;
      }

      function rebuildCraftStepList(opts) {
        const o = opts || {};
        const prev =
          craftStepIndex >= 0 && craftStepList[craftStepIndex]
            ? craftStepList[craftStepIndex]
            : craftPin
              ? { x: craftPin.x, y: craftPin.y }
              : null;
        craftStepList = buildCraftStepList();
        if (o.reset) {
          craftStepIndex = -1;
          return;
        }
        if (prev) {
          const idx = craftStepList.findIndex(
            (c) => c.x === prev.x && c.y === prev.y
          );
          craftStepIndex = idx;
        } else if (!craftStepList.length) {
          craftStepIndex = -1;
        }
      }

      function pulseCraftStepFocus() {
        if (!craftStepFocus) return;
        craftStepFocus.classList.remove("is-pulse");
        void craftStepFocus.offsetWidth;
        craftStepFocus.classList.add("is-pulse");
        window.setTimeout(() => {
          if (craftStepFocus) craftStepFocus.classList.remove("is-pulse");
        }, 480);
      }

      function colorIdEq(a, b) {
        if (a == null || b == null) return false;
        return a === b || String(a) === String(b);
      }

      function cellKey(x, y) {
        return window.FGBeadCraftProgress
          ? FGBeadCraftProgress.cellKey(x, y)
          : String(x | 0) + "," + String(y | 0);
      }

      function isCellPlaced(x, y) {
        return craftPlaced.has(cellKey(x, y));
      }

      function setCellPlaced(x, y, on) {
        const k = cellKey(x, y);
        if (on) {
          if (craftPlaced.has(k)) return false;
          craftPlaced.add(k);
        } else {
          if (!craftPlaced.has(k)) return false;
          craftPlaced.delete(k);
        }
        craftProgressDirty = true;
        return true;
      }

      function toggleCellPlaced(x, y) {
        return setCellPlaced(x, y, !isCellPlaced(x, y));
      }

      function opaqueBeadTotal() {
        if (!lastQuantized) return 0;
        const d = lastQuantized.data;
        let n = 0;
        for (let i = 3; i < d.length; i += 4) {
          if (d[i] >= 16) n++;
        }
        return n;
      }

      /** Mark / unmark every visual cell of a palette color. */
      function setColorCellsPlaced(colorId, on) {
        if (!lastQuantized || !lastPalette || colorId == null) return;
        const focus = lastPalette.colors.find((c) => colorIdEq(c.id, colorId));
        if (!focus) return;
        const rgb = focus.rgb || FGPalettes.hexToRgb(focus.hex);
        if (!rgb) return;
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        const d = lastQuantized.data;
        for (let y = 0; y < h; y++) {
          for (let vx = 0; vx < w; vx++) {
            const sx = mirrorH ? w - 1 - vx : vx;
            const i = (y * w + sx) * 4;
            if (d[i + 3] < 16) continue;
            if (d[i] !== rgb[0] || d[i + 1] !== rgb[1] || d[i + 2] !== rgb[2]) continue;
            setCellPlaced(vx, y, on);
          }
        }
      }

      /** Derive whole-color 「已摆完」 from cell placement. */
      function syncCraftDoneIdsFromPlaced() {
        craftDoneIds = new Set();
        if (!lastQuantized || !lastPalette || !lastCounts) return;
        const w = lastQuantized.width;
        const h = lastQuantized.height;
        const d = lastQuantized.data;
        const rgbToId = Object.create(null);
        lastPalette.colors.forEach((c) => {
          const rgb = c.rgb || FGPalettes.hexToRgb(c.hex);
          if (!rgb) return;
          rgbToId[rgb[0] + "," + rgb[1] + "," + rgb[2]] = c.id;
        });
        const need = Object.create(null);
        const got = Object.create(null);
        lastPalette.colors.forEach((c) => {
          if ((lastCounts[c.id] || 0) > 0) {
            need[c.id] = lastCounts[c.id];
            got[c.id] = 0;
          }
        });
        for (let y = 0; y < h; y++) {
          for (let vx = 0; vx < w; vx++) {
            if (!isCellPlaced(vx, y)) continue;
            const sx = mirrorH ? w - 1 - vx : vx;
            const i = (y * w + sx) * 4;
            if (d[i + 3] < 16) continue;
            const id = rgbToId[d[i] + "," + d[i + 1] + "," + d[i + 2]];
            if (id == null || got[id] == null) continue;
            got[id]++;
          }
        }
        Object.keys(need).forEach((idKey) => {
          if (got[idKey] < need[idKey]) return;
          const c =
            lastPalette &&
            lastPalette.colors.find((col) => colorIdEq(col.id, idKey));
          craftDoneIds.add(c ? c.id : idKey);
        });
      }

      function saveCraftProgressNow() {
        if (!window.FGBeadCraftProgress || !lastQuantized || !craftFingerprint) return;
        FGBeadCraftProgress.save(craftFingerprint, {
          w: lastQuantized.width,
          h: lastQuantized.height,
          placed: Array.from(craftPlaced),
          guide: craftGuide,
          focusId: craftFocusId,
          row: craftRow,
          col: craftCol,
          zoneSize: craftZoneSize,
          focusZone: craftFocusZone,
          craftMirrorH: craftMirrorH,
          craftMirrorV: craftMirrorV,
        });
        craftProgressDirty = false;
        if (activeDraftId) touchActiveDraftMeta();
      }

      function defaultDraftTitle() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return (
          t("perler.draft.defaultTitle") +
          " " +
          pad(d.getMonth() + 1) +
          "-" +
          pad(d.getDate()) +
          " " +
          pad(d.getHours()) +
          ":" +
          pad(d.getMinutes())
        );
      }

      function setDraftPanelOpen(open) {
        if (!draftPanel || !btnDraftToggle) return;
        if (open) {
          draftPanel.hidden = false;
          draftPanel.removeAttribute("hidden");
          btnDraftToggle.setAttribute("aria-expanded", "true");
          btnDraftToggle.classList.add("is-active");
        } else {
          draftPanel.hidden = true;
          draftPanel.setAttribute("hidden", "");
          btnDraftToggle.setAttribute("aria-expanded", "false");
          btnDraftToggle.classList.remove("is-active");
        }
      }

      function syncDraftChrome() {
        const ready = !!lastQuantized;
        if (btnDraftToggle) {
          btnDraftToggle.disabled = !ready;
          btnDraftToggle.textContent = t("perler.draft.title");
        }
        if (btnDraftSave) btnDraftSave.disabled = !ready;
        if (draftBoundEl) {
          if (activeDraftId && activeDraftTitle) {
            draftBoundEl.hidden = false;
            draftBoundEl.textContent = t("perler.draft.bound").replace(
              "{title}",
              activeDraftTitle
            );
          } else {
            draftBoundEl.hidden = false;
            draftBoundEl.textContent = t("perler.draft.unbound");
          }
        }
      }

      function formatDraftTime(ts) {
        if (!ts) return "";
        try {
          const d = new Date(ts);
          const pad = (n) => String(n).padStart(2, "0");
          return (
            pad(d.getMonth() + 1) +
            "-" +
            pad(d.getDate()) +
            " " +
            pad(d.getHours()) +
            ":" +
            pad(d.getMinutes())
          );
        } catch (_) {
          return "";
        }
      }

      async function touchActiveDraftMeta() {
        if (!activeDraftId || !window.FGBeadCraftDrafts || !lastQuantized) return;
        try {
          const row = await FGBeadCraftDrafts.get(activeDraftId);
          if (!row) return;
          row.placedCount = craftPlaced.size;
          row.beadTotal = opaqueBeadTotal();
          row.fingerprint = craftFingerprint || row.fingerprint;
          row.updatedAt = Date.now();
          await FGBeadCraftDrafts.put(row);
          paintDraftList();
        } catch (_) {
          /* ignore */
        }
      }

      async function paintDraftList() {
        if (!draftListEl) return;
        if (!window.FGBeadCraftDrafts) {
          draftListEl.innerHTML =
            '<li class="draft-list__empty">' +
            t("perler.draft.unavailable") +
            "</li>";
          return;
        }
        let rows = [];
        try {
          rows = await FGBeadCraftDrafts.list();
        } catch (_) {
          draftListEl.innerHTML =
            '<li class="draft-list__empty">' +
            t("perler.draft.unavailable") +
            "</li>";
          return;
        }
        if (!rows.length) {
          draftListEl.innerHTML =
            '<li class="draft-list__empty">' + t("perler.draft.empty") + "</li>";
          syncDraftChrome();
          return;
        }
        draftListEl.innerHTML = rows
          .map((r) => {
            const prog =
              r.beadTotal > 0
                ? t("perler.draft.progress")
                    .replace("{n}", String(r.placedCount | 0))
                    .replace("{total}", String(r.beadTotal | 0))
                : r.w + "×" + r.h;
            const active = r.id === activeDraftId ? " is-active" : "";
            const thumb = r.thumb
              ? '<img class="draft-card__thumb" src="' +
                r.thumb +
                '" alt="" width="52" height="52" />'
              : '<div class="draft-card__thumb" aria-hidden="true"></div>';
            const title = String(r.title || t("perler.draft.defaultTitle"))
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/"/g, "&quot;");
            return (
              '<li class="draft-card' +
              active +
              '" data-draft-id="' +
              r.id +
              '">' +
              thumb +
              '<div class="draft-card__body">' +
              '<p class="draft-card__title">' +
              title +
              "</p>" +
              '<p class="draft-card__meta">' +
              prog +
              " · " +
              formatDraftTime(r.updatedAt) +
              "</p>" +
              '<div class="draft-card__actions">' +
              '<button type="button" class="btn btn--ghost" data-draft-open="' +
              r.id +
              '">' +
              t("perler.draft.open") +
              "</button>" +
              '<button type="button" class="btn btn--ghost" data-draft-delete="' +
              r.id +
              '">' +
              t("perler.draft.delete") +
              "</button>" +
              "</div></div></li>"
            );
          })
          .join("");
        draftListEl.querySelectorAll("[data-draft-open]").forEach((btn) => {
          btn.addEventListener("click", () => openDraftById(btn.getAttribute("data-draft-open")));
        });
        draftListEl.querySelectorAll("[data-draft-delete]").forEach((btn) => {
          btn.addEventListener("click", () =>
            deleteDraftById(btn.getAttribute("data-draft-delete"))
          );
        });
        syncDraftChrome();
      }

      async function saveDraft() {
        if (!lastQuantized || !lastPalette) {
          if (tip) tip.textContent = t("perler.draft.needPattern");
          return;
        }
        if (!window.FGBeadCraftDrafts) {
          if (tip) tip.textContent = t("perler.draft.unavailable");
          return;
        }
        try {
          if (!craftFingerprint && window.FGBeadCraftProgress) {
            craftFingerprint = FGBeadCraftProgress.fingerprint(
              lastQuantized,
              lastPalette.id
            );
          }
          saveCraftProgressNow();
          const overwrite = !!activeDraftId;
          let title = activeDraftTitle || defaultDraftTitle();
          if (!overwrite) {
            const asked = window.prompt(t("perler.draft.save"), title);
            if (asked == null) return;
            title = String(asked).trim() || defaultDraftTitle();
          }
          const draft = await FGBeadCraftDrafts.saveFromImageData(lastQuantized, {
            id: overwrite ? activeDraftId : undefined,
            title: title,
            fingerprint: craftFingerprint,
            paletteId: lastPalette.id || "",
            placedCount: craftPlaced.size,
            beadTotal: opaqueBeadTotal(),
          });
          activeDraftId = draft.id;
          activeDraftTitle = draft.title;
          if (tip) tip.textContent = t("perler.draft.saved");
          await paintDraftList();
          FGTool.track("perler", overwrite ? "draft_update" : "draft_save");
        } catch (err) {
          if (tip) tip.textContent = t("perler.draft.unavailable");
        }
      }

      async function openDraftById(id) {
        if (!id || !window.FGBeadCraftDrafts) return;
        if (lastQuantized && !window.confirm(t("perler.draft.confirmOpen"))) return;
        try {
          const packed = await FGBeadCraftDrafts.loadImageData(id);
          if (!packed || !packed.imageData) return;
          const wasCraft = craftMode;
          if (wasCraft) setCraftMode(false);
          activeDraftId = packed.draft.id;
          activeDraftTitle = packed.draft.title || t("perler.draft.defaultTitle");
          const palId = packed.draft.paletteId || "mard-221";
          const wasRm = rmBgOn;
          rmBgOn = false;
          applyQuantizedHandoff(packed.imageData, palId);
          rmBgOn = wasRm;
          syncRmBgUi();
          /* refreshFromQuantized inside applyRmBg loads progress by fingerprint */
          await paintDraftList();
          if (wasCraft) setCraftMode(true);
          FGTool.track("perler", "draft_open");
        } catch (_) {
          if (tip) tip.textContent = t("perler.draft.unavailable");
        }
      }

      async function deleteDraftById(id) {
        if (!id || !window.FGBeadCraftDrafts) return;
        if (!window.confirm(t("perler.draft.confirmDelete"))) return;
        try {
          await FGBeadCraftDrafts.remove(id);
          if (activeDraftId === id) {
            activeDraftId = "";
            activeDraftTitle = "";
          }
          await paintDraftList();
          FGTool.track("perler", "draft_delete");
        } catch (_) {
          if (tip) tip.textContent = t("perler.draft.unavailable");
        }
      }

      /** Visual keys flip with horizontal mirror so the same physical beads stay marked. */
      function remapPlacedAfterMirrorFlip() {
        if (!lastQuantized || !craftPlaced.size) return;
        const w = lastQuantized.width;
        const next = new Set();
        craftPlaced.forEach((k) => {
          const parts = String(k).split(",");
          const x = +parts[0];
          const y = +parts[1];
          if (!Number.isFinite(x) || !Number.isFinite(y)) return;
          next.add(cellKey(w - 1 - x, y));
        });
        craftPlaced = next;
        craftProgressDirty = true;
        syncCraftDoneIdsFromPlaced();
      }

      function loadCraftProgressForFingerprint(fp) {
        craftPlaced = new Set();
        craftDoneIds = new Set();
        craftProgressDirty = false;
        if (!window.FGBeadCraftProgress || !fp) return false;
        const saved = FGBeadCraftProgress.load(fp);
        if (!saved || !Array.isArray(saved.placed)) return false;
        saved.placed.forEach((k) => {
          if (typeof k === "string" && k.indexOf(",") > 0) craftPlaced.add(k);
        });
        if (window.FGBeadCraftProgress && FGBeadCraftProgress.normalizeGuide) {
          craftGuide = FGBeadCraftProgress.normalizeGuide(saved.guide);
        } else if (
          saved.guide === "row" ||
          saved.guide === "color" ||
          saved.guide === "column" ||
          saved.guide === "zone"
        ) {
          craftGuide = saved.guide;
        }
        if (saved.focusId != null) craftFocusId = saved.focusId;
        if (Number.isFinite(+saved.row)) craftRow = Math.max(0, +saved.row | 0);
        if (Number.isFinite(+saved.col)) craftCol = Math.max(0, +saved.col | 0);
        if (Number.isFinite(+saved.zoneSize) && +saved.zoneSize > 0) {
          craftZoneSize = Math.max(1, +saved.zoneSize | 0);
        }
        if (saved.focusZone && typeof saved.focusZone === "object") {
          craftFocusZone = {
            zr: Math.max(0, saved.focusZone.zr | 0),
            zc: Math.max(0, saved.focusZone.zc | 0),
          };
        }
        craftMirrorH = !!saved.craftMirrorH;
        craftMirrorV = !!saved.craftMirrorV;
        craftZoneLayout = null;
        syncCraftDoneIdsFromPlaced();
        return craftPlaced.size > 0;
      }

      /** Recompute fingerprint after a new pattern; restore matching progress if any. */
      function syncCraftProgressToPattern() {
        if (!lastQuantized || !window.FGBeadCraftProgress) {
          craftFingerprint = "";
          craftPlaced = new Set();
          return;
        }
        const fp = FGBeadCraftProgress.fingerprint(
          lastQuantized,
          lastPalette && lastPalette.id
        );
        if (fp === craftFingerprint) return;
        if (craftProgressDirty && craftFingerprint) saveCraftProgressNow();
        craftFingerprint = fp;
        loadCraftProgressForFingerprint(fp);
        /* Pattern changed — drop draft binding if it no longer matches */
        if (activeDraftId) reconcileActiveDraftBinding();
      }

      async function reconcileActiveDraftBinding() {
        if (!activeDraftId || !window.FGBeadCraftDrafts) return;
        try {
          const row = await FGBeadCraftDrafts.get(activeDraftId);
          if (!row || row.fingerprint !== craftFingerprint) {
            activeDraftId = "";
            activeDraftTitle = "";
            syncDraftChrome();
            paintDraftList();
          }
        } catch (_) {
          /* ignore */
        }
      }

      /**
       * Place the stepped bead at the viewport center (absolute pan, no delta feedback).
       * Legend color clicks must never call this.
       */
      function ensureCraftPinVisible() {
        if (!craftPin || !craftViewport) return;
        const { vw, vh } = viewportSize();
        const scale = cssViewScale();
        if (showCellCodes) {
          /* Bitmap already zoomed — use live layout once, then absolute pan. */
          const layout = patternAxisLayout();
          if (!layout) return;
          const px = layout.centerX(craftPin.x);
          const py = layout.centerY(craftPin.y);
          viewPanX += vw * 0.5 - px;
          viewPanY += vh * 0.52 - py;
        } else {
          const c = cellCenterBitmap(craftPin.x, craftPin.y);
          viewPanX = vw * 0.5 - c.x * scale;
          viewPanY = vh * 0.52 - c.y * scale;
        }
        applyViewTransform();
      }

      function applyCraftStepPin() {
        if (craftStepIndex < 0 || craftStepIndex >= craftStepList.length) {
          craftStepFromNav = false;
          return;
        }
        const cell = craftStepList[craftStepIndex];
        craftPin = { x: cell.x, y: cell.y };
        craftStepFromNav = true;
        if (!craftAxisOn) setCraftAxisOn(true);
        else syncCraftAxisUi();
        syncCraftStepUi({ pulse: true });
        ensureCraftPinVisible();
      }

      function goCraftStep(delta) {
        if (!craftMode || !lastQuantized) return;
        /* Next: mark current pin as placed, then jump to next unfinished cell */
        if (delta > 0 && craftPin) {
          if (setCellPlaced(craftPin.x, craftPin.y, true)) {
            syncCraftDoneIdsFromPlaced();
            saveCraftProgressNow();
          }
        }
        rebuildCraftStepList();
        if (!craftStepList.length && delta > 0 && promoteCraftRangeIfEmpty()) {
          rebuildCraftStepList({ reset: true });
          syncCraftRangeLabel();
        }
        if (!craftStepList.length) {
          craftStepIndex = -1;
          craftPin = null;
          craftStepFromNav = false;
          syncCraftAxisUi();
          syncCraftStepUi();
          drawPatternCanvas();
          paintLegend(lastCounts || {});
          return;
        }
        if (craftStepIndex < 0) {
          craftStepIndex = delta >= 0 ? 0 : craftStepList.length - 1;
        } else if (delta > 0) {
          /* After marking, current cell left the list — stay on new index 0 of remaining, or advance */
          craftStepIndex = 0;
        } else {
          const n = craftStepList.length;
          craftStepIndex = (craftStepIndex + delta + n) % n;
        }
        applyCraftStepPin();
        drawPatternCanvas();
        paintLegend(lastCounts || {});
        FGTool.track("perler", delta >= 0 ? "craft_step_next" : "craft_step_prev");
      }

      function syncCraftStepUi(opts) {
        const o = opts || {};
        if (!craftStepEl) return;
        const show = !!craftMode && !!lastQuantized;
        craftStepEl.hidden = !show;
        if (show) craftStepEl.removeAttribute("hidden");
        else craftStepEl.setAttribute("hidden", "");
        if (!show) return;

        const total = craftStepList.length;
        const empty = total === 0;
        if (craftStepPrev) craftStepPrev.disabled = empty;
        if (craftStepNext) craftStepNext.disabled = empty;

        if (craftStepPrev) {
          craftStepPrev.textContent = "◀";
          craftStepPrev.title = t("perler.craft.stepPrev");
          craftStepPrev.setAttribute("aria-label", t("perler.craft.stepPrev"));
        }
        if (craftStepNext) {
          craftStepNext.textContent = t("perler.craft.stepNext");
          craftStepNext.title = t("perler.craft.stepNextHint");
          craftStepNext.setAttribute("aria-label", t("perler.craft.stepNext"));
        }
        const tagEl = craftStepEl.querySelector(".craft-step__tag");
        if (tagEl) tagEl.textContent = t("perler.craft.stepTag");

        const placedN = craftPlaced.size;
        const beadTotal = opaqueBeadTotal();
        const progressTxt =
          beadTotal > 0
            ? t("perler.craft.progressOf")
                .replace("{n}", String(placedN))
                .replace("{total}", String(beadTotal))
            : "";

        if (empty) {
          if (craftStepCoord) craftStepCoord.textContent = "—";
          if (craftStepMeta) {
            craftStepMeta.textContent = progressTxt || t("perler.craft.stepEmpty");
            craftStepMeta.classList.toggle("is-empty", !progressTxt);
          }
          return;
        }

        if (craftStepMeta) craftStepMeta.classList.remove("is-empty");
        if (craftStepIndex < 0) {
          if (craftStepCoord) craftStepCoord.textContent = t("perler.craft.stepReady");
          if (craftStepMeta) {
            craftStepMeta.textContent =
              (progressTxt ? progressTxt + " · " : "") +
              t("perler.craft.stepOf")
                .replace("{n}", "0")
                .replace("{total}", String(total));
          }
        } else {
          const cell = craftStepList[craftStepIndex];
          if (craftStepCoord) {
            const vv = toCraftViewXY(cell.x, cell.y);
            craftStepCoord.textContent = t("perler.craft.pinLabel")
              .replace("{x}", String(vv.x + 1))
              .replace("{y}", String(vv.y + 1));
          }
          if (craftStepMeta) {
            craftStepMeta.textContent =
              (progressTxt ? progressTxt + " · " : "") +
              t("perler.craft.stepOf")
                .replace("{n}", String(craftStepIndex + 1))
                .replace("{total}", String(total));
          }
        }
        if (o.pulse) pulseCraftStepFocus();
      }

      /** Pattern cell under pointer (matches mirrored display); 0-based. */
      function cellFromEventVisual(e) {
        if (!lastQuantized || !canvas) return null;
        const pt = e.touches && e.touches[0] ? e.touches[0] : e;
        const rect = canvas.getBoundingClientRect();
        const bw = canvas.width;
        const bh = canvas.height;
        if (!rect.width || !rect.height || !bw || !bh) return null;
        const cols = lastQuantized.width;
        const rows = lastQuantized.height;
        const beads = viewEl.value === "beads";
        const gap = beads ? 1 : 0;
        const stepBx = gap > 0 ? (bw + gap) / cols : bw / cols;
        const stepBy = gap > 0 ? (bh + gap) / rows : bh / rows;
        const localX = ((pt.clientX - rect.left) / rect.width) * bw;
        const localY = ((pt.clientY - rect.top) / rect.height) * bh;
        const x = Math.floor(localX / stepBx);
        const y = Math.floor(localY / stepBy);
        if (x < 0 || y < 0 || x >= cols || y >= rows) return null;
        return { x, y };
      }

      /**
       * Map pattern grid → screen inside the viewport.
       * Uses bitmap step (beads gap) so ticks sit on pattern cells, not equal canvas slices.
       */
      function patternAxisLayout() {
        if (!lastQuantized || !canvas || !craftViewport) return null;
        const cols = lastQuantized.width;
        const rows = lastQuantized.height;
        const bw = canvas.width || 0;
        const bh = canvas.height || 0;
        if (!cols || !rows || !bw || !bh) return null;
        const vp = craftViewport.getBoundingClientRect();
        const cr = canvas.getBoundingClientRect();
        if (!vp.width || !vp.height || !cr.width || !cr.height) return null;
        const beads = viewEl.value === "beads";
        const gap = beads ? 1 : 0;
        /* drawBeadGrid: width = cols * (cell+gap) - gap  → step = (bw+gap)/cols */
        const stepBx = gap > 0 ? (bw + gap) / cols : bw / cols;
        const stepBy = gap > 0 ? (bh + gap) / rows : bh / rows;
        const cellBx = stepBx - gap;
        const cellBy = stepBy - gap;
        const sx = cr.width / bw;
        const sy = cr.height / bh;
        const ox = cr.left - vp.left;
        const oy = cr.top - vp.top;
        return {
          cols,
          rows,
          vp,
          ox,
          oy,
          gap,
          /* viewport px of pattern cell i left / top edge */
          edgeX: (i) => ox + i * stepBx * sx,
          edgeY: (i) => oy + i * stepBy * sy,
          centerX: (i) => ox + (i * stepBx + cellBx * 0.5) * sx,
          centerY: (i) => oy + (i * stepBy + cellBy * 0.5) * sy,
          cellW: cellBx * sx,
          cellH: cellBy * sy,
          stepW: stepBx * sx,
          stepH: stepBy * sy,
        };
      }

      function syncCraftAxisUi() {
        const showRails = !!(craftMode && craftAxisOn && lastQuantized);
        const hide = (el) => {
          if (!el) return;
          el.hidden = true;
          el.setAttribute("hidden", "");
        };
        const reveal = (el) => {
          if (!el) return;
          el.hidden = false;
          el.removeAttribute("hidden");
        };
        const layout = patternAxisLayout();
        if (!showRails || !layout) {
          hide(craftAxisX);
          hide(craftAxisY);
          hide(craftAxisCorner);
        } else {
          reveal(craftAxisCorner);
          reveal(craftAxisX);
          reveal(craftAxisY);

          const railPadX = 28;
          const railPadY = 22;
          const { cols, rows, vp } = layout;

          function buildRail(axis) {
            const el = axis === "x" ? craftAxisX : craftAxisY;
            if (!el) return;
            const parts = [];
            const pad = axis === "x" ? railPadX : railPadY;
            const viewLen = axis === "x" ? vp.width : vp.height;
            const count = axis === "x" ? cols : rows;
            const edgeAt = axis === "x" ? layout.edgeX : layout.edgeY;
            const centerAt = axis === "x" ? layout.centerX : layout.centerY;
            const step = axis === "x" ? layout.stepW : layout.stepH;
            const cell = axis === "x" ? layout.cellW : layout.cellH;
            for (let i = 0; i < count; i++) {
              const n = i + 1;
              const edge = edgeAt(i);
              const center = centerAt(i);
              const visible = edge + step > pad && edge < viewLen;
              if (!visible) continue;
              const isMajor = n % 10 === 0;
              const isMinor = n % 5 === 0;
              if (!isMinor && !isMajor && cell < 12) continue;
              const tickPos = edge - pad;
              const cls =
                "craft-axis-rail__tick" + (isMajor || isMinor ? " is-major" : "");
              parts.push(
                '<span class="' +
                  cls +
                  '" style="' +
                  (axis === "x" ? "left:" : "top:") +
                  tickPos.toFixed(1) +
                  'px"></span>'
              );
              if (isMajor || (isMinor && cell >= 16)) {
                const labelPos = center - pad;
                if (labelPos > 8 && labelPos < viewLen - pad - 8) {
                  parts.push(
                    '<span class="craft-axis-rail__num" style="' +
                      (axis === "x" ? "left:" : "top:") +
                      labelPos.toFixed(1) +
                      'px">' +
                      n +
                      "</span>"
                  );
                }
              }
            }
            const endEdge = edgeAt(count);
            const endTick = endEdge - pad;
            if (endEdge >= pad && endEdge <= viewLen) {
              parts.push(
                '<span class="craft-axis-rail__tick is-major" style="' +
                  (axis === "x" ? "left:" : "top:") +
                  endTick.toFixed(1) +
                  'px"></span>'
              );
            }
            el.innerHTML = parts.join("");
          }

          buildRail("x");
          buildRail("y");
        }

        if (craftMode && craftPin && craftPinEl && craftPinLabel && layout) {
          const { vp } = layout;
          const px = layout.centerX(craftPin.x);
          const py = layout.centerY(craftPin.y);
          if (px < -20 || py < -20 || px > vp.width + 20 || py > vp.height + 20) {
            hide(craftPinEl);
          } else {
            reveal(craftPinEl);
            craftPinEl.classList.toggle("craft-pin--step", !!craftStepFromNav);
            craftPinEl.style.left = px + "px";
            craftPinEl.style.top = py + "px";
            const box = craftPinEl.querySelector(".craft-pin__box");
            if (box) {
              box.style.width = Math.max(8, layout.cellW) + "px";
              box.style.height = Math.max(8, layout.cellH) + "px";
            }
            const vv = toCraftViewXY(craftPin.x, craftPin.y);
            craftPinLabel.textContent = t("perler.craft.pinLabel")
              .replace("{x}", String(vv.x + 1))
              .replace("{y}", String(vv.y + 1));
          }
        } else {
          hide(craftPinEl);
          if (craftPinEl) craftPinEl.classList.remove("craft-pin--step");
        }
      }

      function setViewScale(next, opts) {
        const o = opts || {};
        const z = Math.round(Math.max(0.25, Math.min(4, next)) * 100) / 100;
        if (z === viewScale && !o.force) {
          syncPreviewToggles();
          return;
        }
        const { vw, vh } = viewportSize();
        const oldS = cssViewScale();
        viewScale = z;
        const newS = cssViewScale();
        /* Zoom toward viewport center so the board does not jump */
        if (oldS > 0 && newS > 0) {
          const cx = (vw * 0.5 - viewPanX) / oldS;
          const cy = (vh * 0.5 - viewPanY) / oldS;
          viewPanX = vw * 0.5 - cx * newS;
          viewPanY = vh * 0.5 - cy * newS;
        }
        applyViewTransform();
        if (showCellCodes) drawPatternCanvas();
        syncPreviewToggles();
      }

      function resetView() {
        viewScale = 1;
        homeViewScale = 1;
        viewPanX = 0;
        viewPanY = 0;
        homeViewPanX = 0;
        homeViewPanY = 0;
        applyViewTransform();
        if (showCellCodes) drawPatternCanvas();
        syncPreviewToggles();
      }

      function fitView() {
        if (!craftViewport || !lastQuantized) {
          resetView();
          return;
        }
        const m = boardMetrics();
        const { vw, vh } = viewportSize();
        const sx = (vw * 0.92) / m.w;
        const sy = (vh * 0.92) / m.h;
        viewScale = Math.round(Math.max(0.25, Math.min(4, Math.min(sx, sy))) * 100) / 100;
        /*
         * On-screen pattern size is always ≈ m * viewScale:
         * - normal: bitmap m, CSS scale viewScale
         * - codes: bitmap already ×viewScale, CSS scale 1
         */
        const dispW = m.w * viewScale;
        const dispH = m.h * viewScale;
        viewPanX = (vw - dispW) / 2;
        viewPanY = (vh - dispH) / 2;
        homeViewScale = viewScale;
        homeViewPanX = viewPanX;
        homeViewPanY = viewPanY;
        /* Key by bead grid size — not canvas CSS pixels (codes/cell must not re-fit) */
        lastViewFitKey = lastQuantized.width + "x" + lastQuantized.height;
        applyViewTransform();
        if (showCellCodes) drawPatternCanvas();
        syncPreviewToggles();
      }

        const mq = window.matchMedia ? window.matchMedia("(max-width: 720px)") : null;

        const mUpload = document.getElementById("perler-m-upload");

        const uploadPair = paramsGrid.querySelector('[data-m-slot="upload"]');

        const slotPreset = document.getElementById("slot-preset");
        const slotPalette = document.getElementById("slot-palette");
        const slotDither = document.getElementById("slot-dither");

        function fieldIn(slot) {
          if (!slot) return null;
          for (let i = 0; i < slot.children.length; i++) {
            const c = slot.children[i];
            if (c.classList && c.classList.contains("field")) return c;
          }
          return slot.querySelector(".field");
        }

        const homes = {
          upload: { el: uploadPair, parent: paramsGrid, before: sidePair },
          side: { el: fieldIn(slotSide), parent: slotSide, before: null },
          preset: { el: fieldIn(slotPreset), parent: slotPreset, before: null },
          dither: { el: fieldIn(slotDither), parent: slotDither, before: null },
          palette: { el: fieldIn(slotPalette), parent: slotPalette, before: null },
          params: { el: paramsPanel, parent: workspace, before: previewStageEl },
          edit: { el: editPanelEl, parent: editHome, before: null },
        };

        function place(el, parent, before) {
          if (!el || !parent) return;
          if (before && before.parentNode === parent) parent.insertBefore(el, before);
          else parent.appendChild(el);
        }

        let mobileOn = null;
        function apply() {
          const on = mq.matches;
          if (on === mobileOn) return;
          mobileOn = on;
          document.body.classList.toggle("perler-is-mobile", on);
          mUpload.hidden = !on;
          mConfig.hidden = !on;

          if (on) {

            const presetEl = homes.preset.el || fieldIn(slotPreset);
            const ditherEl = homes.dither.el || fieldIn(slotDither);
            const paletteEl = homes.palette.el || fieldIn(slotPalette);
            homes.side.el = sideEl;
            homes.preset.el = presetEl;
            homes.dither.el = ditherEl;
            homes.palette.el = paletteEl;
            if (sideEl) {
              sideEl.dataset.mField = "side";
              place(sideEl, mQuickGrid, null);
            }
            if (presetEl) place(presetEl, mQuickGrid, null);
            if (paletteEl) place(paletteEl, mQuickGrid, null);
            if (ditherEl) place(ditherEl, mQuickGrid, null);
            place(paramsPanel, mConfigRest, null);
            place(editPanelEl, mEdit, null);
            /* Phone hides follow UI — exit so dimmed craft view cannot get stuck */
            if (craftMode) setCraftMode(false);
            setEditArmed(false);

            place(homes.side.el, homes.side.parent, null);

            place(homes.dither.el, homes.dither.parent, null);
            place(homes.palette.el, homes.palette.parent, null);

            place(editPanelEl, homes.edit.parent, null);
            setEditArmed(false);
            if (window.FGCandySelect) FGCandySelect.syncViewport();
          }
          syncEditChrome();
          /* Viewport aspect changes on mobile ↔ desktop — re-fit square stage */
          if (lastQuantized) {
            requestAnimationFrame(() => fitView());
          }
        }

        apply();
        if (mq.addEventListener) mq.addEventListener("change", apply);
        else if (mq.addListener) mq.addListener(apply);
      })();

      function syncStockSwatchState() {
        if (!stockSwatches) return;

        if (stockAutoHint) {
          stockAutoHint.hidden = !auto;
          if (auto) stockAutoHint.removeAttribute("hidden");

        if (auto) return;

        stockSwatches.classList.toggle("is-disabled", !enabled);
        stockSwatches.querySelectorAll(".stock-swatch").forEach((b) => {
          const cid = +(b.dataset.colorId || 0);
          const on = owned.has(cid);
          b.classList.toggle("is-owned", on);
