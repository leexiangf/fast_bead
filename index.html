<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast Bead – Photo to Perler Pattern (open source)</title>
  <meta name="description" content="Open-source photo → perler / fuse-bead pattern generator. Color mapping, craft mode, print export. Runs fully in the browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/site.css" />
  <link rel="stylesheet" href="./css/arcade-tokens.css" />
  </head>
<body class="arcade-ui" data-i18n-title="meta.perler.title" data-i18n-desc="meta.perler.desc">
  <div class="wrap wrap--wide wrap--tool-bleed">
    <nav data-chrome-nav="perler"></nav>

    <header class="tool-hero">
      <h1 data-i18n="perler.h1"></h1>
      <p data-i18n="perler.lead"></p>
    </header>

    <div class="workspace workspace--params2 workspace--perler">
      <!-- Phone-only shells; desktop keeps the classic single params column -->
      <section class="panel perler-m-upload" id="perler-m-upload" hidden>
        <div class="params-grid params-grid--pairs" id="perler-m-upload-grid"></div>
      </section>
      <!-- Phone-only: essentials + params stacked above preview -->
      <section class="panel perler-m-config" id="perler-m-config" hidden>
        <div class="panel__title perler-m-config__title" data-i18n="perler.config"></div>
        <div class="perler-m-quick__grid" id="perler-m-quick-grid"></div>
        <div class="perler-m-config__rest" id="perler-m-config-rest"></div>
      </section>

      <aside class="panel panel--params" id="perler-params">
        <div class="panel__title perler-params__title" data-i18n="common.params"></div>
        <div class="params-grid params-grid--pairs" id="perler-params-grid">
          <!-- Right dropzone spans template + grid-size rows; preset/palette/ncolors shift down -->
          <div class="params-pair" data-m-slot="upload">
            <div class="params-cell params-cell--left" id="slot-tpl">
              <div class="tpl tpl--compact" id="tpl-panel">
                <div class="panel__title" data-i18n="perler.tpl.title"></div>
                <div class="tpl__tabs" id="tpl-tabs" role="tablist" hidden></div>
                <div class="tpl__grid tpl__grid--single" id="tpl-grid"></div>
              </div>
            </div>
            <div class="params-cell params-cell--right params-cell--drop-span" id="slot-drop">
              <div class="dropzone dropzone--lg dropzone--params" id="drop">
                <span data-i18n="common.drop"></span>
                <input type="file" accept="image/jpeg,image/jpg,image/png,image/webp,image/gif,image/*" />
              </div>
              <button type="button" class="btn btn--ghost btn--rotate-src" id="btn-rotate" disabled data-i18n="perler.rotate"></button>
            </div>
          </div>

          <div class="params-pair" data-m-slot="side">
            <div class="params-cell params-cell--left" id="slot-side">
              <div class="field">
                <label for="side"><span data-i18n="perler.side"></span> <span id="side-hint">96</span></label>
                <input id="side" type="range" min="32" max="144" value="96" />
              </div>
            </div>
          </div>

          <div class="params-pair">
            <div class="params-cell params-cell--left">
              <div class="field">
                <label for="fit" data-i18n="perler.fit"></label>
                <div class="field__combo">
                  <select id="fit">
                    <option value="cover" selected data-i18n="perler.fit.cover"></option>
                    <option value="contain" data-i18n="perler.fit.contain"></option>
                    <option value="stretch" data-i18n="perler.fit.stretch"></option>
                  </select>
                  <button type="button" class="btn btn--ghost field__combo-btn" id="btn-crop" disabled data-i18n="perler.crop.open"></button>
                </div>
              </div>
            </div>
            <div class="params-cell params-cell--right" id="slot-preset">
              <div class="field">
                <label for="preset" data-i18n="perler.preset"></label>
                <select id="preset">
                  <option value="photo" selected data-i18n="perler.preset.photo"></option>
                  <option value="detail" data-i18n="perler.preset.detail"></option>
                  <option value="beadants" data-i18n="perler.preset.beadants"></option>
                  <option value="handlike" data-i18n="perler.preset.handlike"></option>
                  <option value="custom" data-i18n="perler.preset.custom"></option>
                </select>
              </div>
            </div>
          </div>

          <div class="params-pair">
            <div class="params-cell params-cell--left" id="slot-dither">
              <div class="field">
                <label for="dither" data-i18n="perler.dither"></label>
                <select id="dither">
                  <option value="fs" selected data-i18n="perler.dither.fs"></option>
                  <option value="fs-v2" data-i18n="perler.dither.fsV2"></option>
                  <option value="bayer" data-i18n="perler.dither.bayer"></option>
                  <option value="none" data-i18n="perler.dither.none"></option>
                  <option value="handlike" data-i18n="perler.dither.handlike"></option>
                </select>
              </div>
            </div>
            <div class="params-cell params-cell--right" id="slot-palette">
              <div class="field">
                <label for="palette" data-i18n="perler.palette"></label>
                <select id="palette"></select>
              </div>
            </div>
          </div>

          <div class="params-pair">
            <div class="params-cell params-cell--left">
              <div class="field">
                <label for="view" data-i18n="perler.view"></label>
                <select id="view">
                  <option value="beads" selected data-i18n="perler.view.beads"></option>
                  <option value="pixels" data-i18n="perler.view.pixels"></option>
                </select>
              </div>
            </div>
            <div class="params-cell params-cell--right">
              <div class="field" id="field-ncolors">
                <label for="ncolors" data-i18n="perler.ncolors"></label>
                <input id="ncolors" type="number" min="8" max="48" value="28" />
              </div>
            </div>
          </div>

          <div class="params-pair params-pair--footer">
            <div class="params-cell params-cell--span">
              <details class="adv" id="adv">
                <summary data-i18n="perler.adv"></summary>
                <div class="adv__body adv__body--cols">
                  <div class="field">
                    <label for="contrast"><span data-i18n="perler.contrast"></span> <span id="contrast-val">1.08</span></label>
                    <input id="contrast" type="range" min="80" max="140" value="108" />
                  </div>
                  <div class="field">
                    <label for="sat"><span data-i18n="perler.sat"></span> <span id="sat-val">1.05</span></label>
                    <input id="sat" type="range" min="70" max="140" value="105" />
                  </div>
                  <div class="field">
                    <label for="cell" data-i18n="perler.cell"></label>
                    <input id="cell" type="number" min="4" max="20" value="8" />
                  </div>
                  <div class="field">
                    <label><input type="checkbox" id="gridlines" /> <span data-i18n="perler.grid"></span></label>
                  </div>
                  <div class="field" id="field-rm-bg-tol">
                    <label for="rm-bg-tol"><span data-i18n="perler.rmBg.tol"></span> <span id="rm-bg-tol-val">36</span></label>
                    <input id="rm-bg-tol" type="range" min="8" max="96" value="36" disabled />
                    <p class="notice" data-i18n="perler.rmBg.hint"></p>
                    <p class="notice" data-i18n="perler.erase.hint"></p>
                  </div>
                </div>
              </details>
            </div>
            <div class="params-cell params-cell--span" id="slot-edit">
              <div class="edit-panel" id="edit-panel" hidden>
                <div class="panel__title" data-i18n="perler.edit.title"></div>
                <p class="edit-panel__hint" data-i18n="perler.edit.tapHint" hidden></p>
                  <div class="edit-tools" id="edit-tools" role="toolbar">
                  <button type="button" class="btn btn--ghost edit-tool is-active" data-edit="paint" data-i18n="perler.edit.paint"></button>
                  <button type="button" class="btn btn--ghost edit-tool" data-edit="bucket" data-i18n="perler.edit.bucket"></button>
                  <button type="button" class="btn btn--ghost edit-tool" data-edit="replace" data-i18n="perler.edit.replace"></button>
                  <button type="button" class="btn btn--ghost edit-tool" data-edit="eraser" data-i18n="perler.edit.eraser"></button>
                  <button type="button" class="btn btn--ghost edit-tool" data-edit="erase-fill" data-i18n="perler.edit.eraseFill"></button>
                  <button type="button" class="btn btn--ghost" id="btn-edit-undo" disabled data-i18n="perler.edit.undo"></button>
                </div>
                <div class="field field--inline" id="field-erase-brush">
                  <label for="erase-brush"><span data-i18n="perler.erase.brush"></span> <span id="erase-brush-val">1</span></label>
                  <input id="erase-brush" type="range" min="1" max="5" value="1" />
                </div>
                <div class="edit-swatches" id="edit-swatches"></div>
              </div>
            </div>
          </div>

          <div class="params-pair params-pair--sparse">
            <div class="params-cell params-cell--span">
              <div class="edit-sparse" id="edit-sparse">
                <div class="edit-sparse__title" data-i18n="perler.sparse.title"></div>
                <div class="edit-sparse__row">
                  <label for="sparse-thr">
                    <span data-i18n="perler.sparse.thr"></span>
                    <input id="sparse-thr" type="number" min="1" max="20" value="5" step="1" />
                  </label>
                  <button type="button" class="btn btn--ghost" id="btn-sparse-merge" data-i18n="perler.sparse.merge"></button>
                </div>
                <p class="edit-sparse__hint" data-i18n="perler.sparse.hint"></p>
              </div>
            </div>
          </div>

          <div class="params-pair">
            <div class="params-cell params-cell--span">
              <details class="edit-clean" id="edit-clean">
                <summary data-i18n="perler.clean.title"></summary>
                <div class="edit-clean__body">
                  <label class="edit-clean__check">
                    <input type="checkbox" id="clean-skip-white" />
                    <span data-i18n="perler.clean.skipWhite"></span>
                  </label>
                  <label class="edit-clean__check">
                    <input type="checkbox" id="clean-smooth" />
                    <span data-i18n="perler.clean.smooth"></span>
                  </label>
                  <div class="actions__row">
                    <button type="button" class="btn btn--ghost" id="btn-clean-islands" disabled data-i18n="perler.clean.clearIslands"></button>
                  </div>
                  <p class="notice" data-i18n="perler.clean.hint"></p>
                </div>
              </details>
            </div>
          </div>
        </div>
      </aside>

      <div class="panel preview-stage" id="preview-stage">
        <div class="craft-dock" id="craft-dock-bar" title="">
          <div class="craft-dock__preview-toggles" id="preview-toggles" role="group">
            <button type="button" class="btn btn--ghost" id="btn-show-codes" disabled data-i18n="perler.codes.toggle" aria-pressed="false"></button>
            <button type="button" class="btn btn--ghost" id="btn-rm-bg" disabled data-i18n="perler.rmBg.toggle" aria-pressed="false"></button>
            <button type="button" class="btn btn--ghost" id="btn-cutout" disabled data-i18n="perler.cutout.toggle" aria-pressed="false"></button>
            <button type="button" class="btn btn--ghost" id="btn-erase" disabled data-i18n="perler.erase.toggle" aria-pressed="false"></button>
            <button type="button" class="btn btn--ghost" id="btn-erase-fill" disabled data-i18n="perler.erase.fill" aria-pressed="false"></button>
            <button type="button" class="btn btn--ghost" id="btn-mirror" disabled data-i18n="perler.mirror.toggle" aria-pressed="false"></button>
            <button type="button" class="btn btn--ghost" id="btn-pan" disabled data-i18n="perler.pan.toggle" aria-pressed="false"></button>
            <span class="craft-dock__zoom-group" role="group" aria-label="zoom">
              <input type="range" id="zoom-slider" class="craft-dock__zoom-slider" min="25" max="400" step="1" value="100" disabled />
              <span class="craft-dock__zoom-pct" id="zoom-pct" aria-hidden="true">100%</span>
              <button type="button" class="btn btn--ghost" id="btn-zoom-reset" disabled data-i18n="perler.zoom.reset"></button>
            </span>
          </div>
          <div class="cutout-dock" id="cutout-dock" hidden>
            <p class="cutout-dock__hint" data-i18n="perler.cutout.hint"></p>
            <div class="cutout-dock__row" role="group">
              <button type="button" class="btn btn--ghost is-active" id="btn-cutout-keep" data-i18n="perler.cutout.keep" aria-pressed="true"></button>
              <button type="button" class="btn btn--ghost" id="btn-cutout-erase" data-i18n="perler.cutout.erase" aria-pressed="false"></button>
              <label class="cutout-dock__brush">
                <span data-i18n="perler.cutout.brush"></span>
                <input type="range" id="cutout-brush" min="1" max="8" step="1" value="3" />
                <span id="cutout-brush-val">3</span>
              </label>
              <button type="button" class="btn btn--primary" id="btn-cutout-apply" data-i18n="perler.cutout.apply"></button>
              <button type="button" class="btn btn--ghost" id="btn-cutout-cancel" data-i18n="perler.cutout.cancel"></button>
            </div>
          </div>
            <div class="craft-dock__tools" id="craft-dock" hidden>
            <div class="craft-dock__modes" role="group">
              <button type="button" class="btn btn--ghost craft-mode is-active" data-craft-mode="color" data-i18n="perler.craft.byColor"></button>
              <button type="button" class="btn btn--ghost craft-mode" data-craft-mode="row" data-i18n="perler.craft.byRow"></button>
              <button type="button" class="btn btn--ghost craft-mode" data-craft-mode="column" data-i18n="perler.craft.byCol"></button>
              <button type="button" class="btn btn--ghost craft-mode" data-craft-mode="zone" data-i18n="perler.craft.byZone"></button>
            </div>
            <div class="craft-dock__row" id="craft-row-ctrl" hidden>
              <button type="button" class="btn btn--ghost" id="craft-row-prev" data-i18n="perler.craft.rangePrev"></button>
              <span class="craft-dock__row-label" id="craft-row-label">1 / 1</span>
              <button type="button" class="btn btn--ghost" id="craft-row-next" data-i18n="perler.craft.rangeNext"></button>
            </div>
            <div class="craft-dock__mirrors" role="group" id="craft-mirror-ctrl" hidden>
              <button type="button" class="btn btn--ghost" id="btn-craft-mirror-h" data-i18n="perler.craft.mirrorH" aria-pressed="false"></button>
              <button type="button" class="btn btn--ghost" id="btn-craft-mirror-v" data-i18n="perler.craft.mirrorV" aria-pressed="false"></button>
            </div>
            <div class="craft-step" id="craft-step" hidden>
              <span class="craft-step__tag" data-i18n="perler.craft.stepTag">逐颗</span>
              <button type="button" class="btn btn--ghost craft-step__nav" id="craft-step-prev" aria-label="prev bead" data-i18n-aria="perler.craft.stepPrev" title="">◀</button>
              <div class="craft-step__focus" id="craft-step-focus" aria-live="polite">
                <span class="craft-step__coord" id="craft-step-coord">—</span>
                <span class="craft-step__meta" id="craft-step-meta"></span>
              </div>
              <button type="button" class="btn btn--ghost craft-step__nav craft-step__nav--primary" id="craft-step-next" aria-label="next bead" data-i18n-aria="perler.craft.stepNext" title="">下一颗 ▶</button>
            </div>
            <button type="button" class="btn btn--ghost is-active" id="btn-craft-axis" data-i18n="perler.craft.axis" aria-pressed="true"></button>
          </div>
          <div class="craft-dock__end">
            <div class="craft-draft" id="craft-draft-wrap">
              <button type="button" class="btn btn--ghost craft-draft__toggle" id="btn-draft-toggle" disabled data-i18n="perler.draft.title" aria-expanded="false" aria-controls="draft-panel">草稿</button>
              <div class="craft-draft__flyout" id="draft-panel" hidden>
                <p class="notice draft-panel__hint" data-i18n="perler.draft.hint"></p>
                <div class="draft-panel__actions">
                  <button type="button" class="btn btn--ghost" id="btn-draft-save" disabled data-i18n="perler.draft.save"></button>
                </div>
                <p class="draft-panel__bound" id="draft-bound" hidden></p>
                <ul class="draft-list" id="draft-list"></ul>
              </div>
            </div>
            <button type="button" class="btn btn--ghost btn--craft" id="btn-craft" disabled data-i18n="perler.craft.toggle"></button>
          </div>
        </div>
        <p class="banner-import" id="import-banner" hidden data-i18n="handoff.imported"></p>
        <p class="banner-import" id="palette-banner" hidden></p>
        <div class="canvas-wrap canvas-wrap--edit" id="craft-viewport">
          <div class="craft-axis-corner" id="craft-axis-corner" hidden aria-hidden="true"></div>
          <div class="craft-axis-rail craft-axis-rail--x" id="craft-axis-x" hidden aria-hidden="true"></div>
          <div class="craft-axis-rail craft-axis-rail--y" id="craft-axis-y" hidden aria-hidden="true"></div>
          <div class="craft-pin" id="craft-pin" hidden>
            <span class="craft-pin__box" aria-hidden="true"></span>
            <span class="craft-pin__label" id="craft-pin-label"></span>
          </div>
          <div class="craft-stage" id="craft-stage">
            <canvas id="out"></canvas>
          </div>
        </div>
        <!-- Phone-only host: edit tools sit under the pattern -->
        <div class="perler-m-edit" id="perler-m-edit" hidden></div>
      </div>

      <aside class="panel bead-side" id="bead-side">
        <div class="panel__title" data-i18n="perler.beadInfo"></div>
        <div class="stats" id="stats" data-i18n="common.noImage"></div>
        <div class="bead-summary" id="bead-summary" hidden>
          <div class="bead-summary__head">
            <div class="bead-summary__total" id="bead-total"></div>
            <p class="bead-summary__buy" id="bead-buy"></p>
            <button type="button" class="btn btn--ghost btn--compact" id="btn-copy-usage" disabled data-i18n="perler.copyUsage"></button>
          </div>
          <ol class="bead-summary__list" id="bead-list"></ol>
        </div>
        <div class="legend" id="legend"></div>
        <div class="struct-panel" id="struct-panel" hidden>
          <div class="panel__title" data-i18n="perler.struct.title"></div>
          <p class="struct-panel__msg" id="struct-msg"></p>
          <p class="struct-panel__tips" id="struct-tips"></p>
          <div class="panel__title struct-panel__board-title" data-i18n="perler.board.title"></div>
          <p class="struct-panel__board" id="board-advice"></p>
        </div>
        <details class="stock-panel" id="stock-panel">
          <summary data-i18n="perler.stock.title"></summary>
          <p class="notice" data-i18n="perler.stock.hint"></p>
          <label class="stock-panel__check">
            <input type="checkbox" id="stock-enabled" />
            <span data-i18n="perler.stock.enable"></span>
          </label>
          <label class="stock-panel__check">
            <input type="checkbox" id="stock-only" />
            <span data-i18n="perler.stock.only"></span>
          </label>
          <p class="notice stock-panel__auto" id="stock-auto-hint" hidden data-i18n="perler.stock.autoHint"></p>
          <div class="stock-swatches" id="stock-swatches"></div>
          <div class="actions__row stock-panel__actions">
            <button type="button" class="btn btn--ghost" id="btn-stock-all" data-i18n="perler.stock.all"></button>
            <button type="button" class="btn btn--ghost" id="btn-stock-none" data-i18n="perler.stock.none"></button>
          </div>
        </details>
        <!-- Below stock panel so opening this block does not shove swatches / scroll upward -->
        <div class="stock-missing" id="stock-missing" hidden></div>
      </aside>
    </div>

    <section class="tool-below panel" aria-label="export">
      <div class="tool-below__grid">
        <div class="tool-below__main">
          <div class="panel__title" data-i18n="perler.belowTitle"></div>
          <div class="actions actions--stack" id="export-actions">
            <div class="actions__row">
              <button type="button" class="btn btn--primary" id="btn-export" disabled data-i18n="perler.export"></button>
              <button type="button" class="btn btn--primary" id="btn-export-codes" disabled data-i18n="perler.exportCodes"></button>
              <button type="button" class="btn btn--primary" id="btn-print" disabled data-i18n="perler.print"></button>
              <button type="button" class="btn btn--ghost" id="btn-csv" disabled data-i18n="perler.csv"></button>
            </div>
            <p class="notice" data-i18n="perler.export.hint"></p>
            <details class="adv" id="print-settings">
              <summary data-i18n="perler.print.settings"></summary>
              <div class="adv__body adv__body--cols">
                <div class="field">
                  <label for="print-tile" data-i18n="perler.print.tile"></label>
                  <select id="print-tile">
                    <option value="0" selected data-i18n="perler.print.tile0"></option>
                    <option value="29" data-i18n="perler.print.tile29"></option>
                    <option value="58" data-i18n="perler.print.tile58"></option>
                  </select>
                </div>
                <div class="field">
                  <label><input type="checkbox" id="print-major" checked /> <span data-i18n="perler.print.major"></span></label>
                </div>
                <div class="field">
                  <label><input type="checkbox" id="print-cell-codes" /> <span data-i18n="perler.print.cellCodes"></span></label>
                </div>
                <div class="field">
                  <label for="pitch-family" data-i18n="perler.pitch.family"></label>
                  <select id="pitch-family">
                    <option value="midi" selected data-i18n="perler.pitch.midi"></option>
                    <option value="mini" data-i18n="perler.pitch.mini"></option>
                  </select>
                </div>
                <div class="field">
                  <label for="print-pitch"><span data-i18n="perler.print.pitch"></span></label>
                  <input id="print-pitch" type="number" min="2.5" max="10" step="0.1" value="5" />
                </div>
                <p class="notice notice--warn" id="pitch-warn" hidden data-i18n="perler.pitch.warn"></p>
                <p class="notice" data-i18n="perler.print.hint"></p>
              </div>
            </details>
            <!-- paint handoff removed in OSS build -->
            <div class="handoff" id="handoff-paint" hidden></div>
          </div>
        </div>
        <div class="tool-below__side">
          <!-- Beadants game CTA removed in OSS build; keep hidden shells so JS ids resolve -->
          <div class="cta-play" id="cta-play" hidden>
            <p class="notice" id="cta-hint" hidden></p>
            <div class="field" id="field-lname" hidden>
              <label for="lname"></label>
              <input id="lname" type="text" value="Custom" maxlength="40" />
            </div>
            <p class="notice" id="level-hint" hidden></p>
            <div class="actions actions--stack" hidden>
              <div class="actions__row actions__row--single" id="cta-switch-row" hidden>
                <button type="button" id="btn-cta-9" hidden></button>
              </div>
              <div class="actions__row" hidden>
                <a id="btn-play" href="#" hidden></a>
                <button type="button" id="btn-level" hidden></button>
              </div>

      function clearEraseMask() {

      function cloneEraseMask() {
        return eraseMask ? new Uint8Array(eraseMask) : null;

        if (!img || !eraseMask) return;
        const n = img.width * img.height;
        if (eraseMask.length !== n) return;
        const d = img.data;
        for (let i = 0; i < n; i++) {
          if (eraseMask[i]) d[i * 4 + 3] = 0;
        }
